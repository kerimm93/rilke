t-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}.candidate{display:grid;grid-template-columns:26px 1fr;gap:13px}.candidate input{margin-top:7px;width:20px;height:20px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.empty{padding:36px 8px;text-align:center;color:var(--muted)}.notice{border-left:3px solid var(--accent);padding:12px 17px;margin:14px 0;background:var(--soft);font-size:14px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}label.field{display:block;font-size:13px;font-weight:650;margin-bottom:15px}label.field input,label.field textarea,label.field select{display:block;margin-top:7px;width:100%;font-size:15px;font-weight:400}input:not([type=checkbox]),select,textarea{border:1px solid var(--rule);background:var(--soft);padding:10px 12px;border-radius:6px;min-height:44px;max-width:100%}textarea{resize:vertical;min-height:100px;line-height:1.5}textarea.code{font:12px/1.6 var(--mono);width:100%;min-height:200px}input[type=checkbox]{accent-color:var(--accent)}.source{font-size:12px;color:var(--muted);margin:8px 0}.source strong{font-weight:650}details{margin:14px 0;border:1px solid var(--rule);border-radius:8px;padding:14px 17px}summary{cursor:pointer;font-size:14px;font-weight:650;min-height:28px}details[open]>summary{margin-bottom:15px}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:var(--soft);padding:16px;border-radius:6px;font:12px/1.55 var(--mono);max-height:400px;overflow:auto}.divider{height:1px;background:var(--rule);margin:24px 0}.step{font-family:var(--mono);font-size:12px;color:var(--accent)}.toolbar{position:sticky;bottom:12px;border:1px solid var(--rule);background:var(--surface);padding:14px 18px;border-radius:10px;display:flex;justify-content:space-between;align-items:center;gap:10px;box-shadow:0 5px 25px #2c24190a;z-index:3}.menu{display:none}.scrim{display:none}#message{position:fixed;right:18px;bottom:18px;max-width:440px;border:1px solid var(--rule);background:var(--surface);padding:15px 20px;z-index:50;box-shadow:0 5px 25px #0001;border-left:3px solid var(--accent)}#message:empty{display:none}dialog{background:var(--surface);color:var(--ink);border:1px solid var(--rule);border-radius:12px;max-width:850px;width:calc(100% - 28px);max-height:90vh;padding:25px;overflow:auto}dialog::backdrop{background:#2c241966}.sticky-actions{position:sticky;bottom:-25px;background:var(--surface);padding:18px 0 0;justify-content:flex-end}fieldset{border:0;margin:0;padding:0;min-width:0}body[data-busy=true] #app{opacity:.7} :focus-visible{outline:2px solid var(--accent);outline-offset:3px}.error-text{color:#a33020}.card-editor textarea{min-height:80px}.check-label{display:flex;gap:10px;align-items:flex-start;font-size:14px}.check-label input{margin-top:5px}#save-warning{padding:10px 24px;border-bottom:1px solid var(--accent);display:none}

<script>
'use strict';
var VERSION='2.1.1', DB_NAME='readwise-workbench-2', CONFIG_KEY='rww2.config', UI_KEY='rww2.ui';
var FORMAT='readwise-workbench-state-v2', GIST_FILE='readwise_workbench_v2.json';
var ROUTES=['anki','reading_journal','qualitative_journal','syntopicon','prosa_zettelkasten','prosa_project','poetry_inspiration','dev_learning','software_idea','other_notion','discard','defer','error'];
var LABELS={new:'Neu',resurfaced:'Wieder aufgegriffen',in_session:'In Session',awaiting_handoff:'Handoff ausstehend',processed:'Verarbeitet',discarded:'Verworfen',deferred:'Vertagt',error:'Prüfen',draft:'Entwurf',approved:'Freigegeben',synced:'In Anki',missing:'Fehlt in Anki',pending_anki:'Anki ausstehend'};
var INBOX_SORTS=[['newest','Neueste Highlights zuerst'],['oldest','Älteste Highlights zuerst'],['imported','Zuletzt importiert zuerst'],['resurfaced','Wieder aufgegriffen zuerst']];
var S, C, UI={view:'inbox',sessionId:'',selected:[],includeDeferred:false,filter:'',inboxSort:'newest',workflowId:'notion',historyFilter:''}, DB=null, BASE=null, BUSY=false, LOCKED=false, passphrase='', _writeQueue=Promise.resolve(), _messageTimer=null;
var WORKFLOW_LABELS={notion:'Notion / flexibel · ohne AnkiConnect',anki:'Dialog + AnkiConnect'};
var NOTION_TEMPLATE="# Readwise Workbench · Notion / flexibel\nDu begleitest meine initiale Verarbeitung von {{COUNT}} Readwise-Highlights. Die Workbench dokumentiert, was ich mit jedem Highlight gemacht habe und wo das Ergebnis liegt. Sie plant kein späteres Lernen.\nArbeite mit mir an einem Highlight oder einem sinnvollen kleinen Zusammenhang nach dem anderen. Readwise-Tags sind Kontext, keine verbindliche Entscheidung. Die stabile Einheit ist die Readwise-Highlight-ID.\nMögliche Verwendungen sind unter anderem: in eine Lernsammlung aufnehmen, einen bestehenden Eintrag ergänzen, eine Reflexion oder Atomic Note ausarbeiten, Schreibmaterial nutzen, eine Sprintnotiz aktualisieren, eine Aufgabe anlegen, frei anders verwenden, vertagen oder verwerfen. Die Liste ist offen. Mehrere Aktionen sind erlaubt, wenn sie unterschiedliche Zwecke erfüllen.\nVor externen Writes: Ermittle mit mir das konkrete Ziel. Lies dessen aktuelle Regeln und gegebenenfalls meinen von mir genannten Database Index. Suche vorhandene Einträge, bevor du neue anlegst. Führe nur beauftragte Writes aus und prüfe ihr Ergebnis. Erfinde keine Properties, Fakten, Nutzeräußerungen oder erfolgreichen Writes. Ohne passenden Zugriff bleibt es ein Entwurf.\nMerke pro Highlight meine Entscheidung, tatsächliche Aktionen und Ergebnisse mit Zielreferenzen. Eigene Gedanken nur dokumentieren, wenn ich sie wirklich geäußert habe. Zusätzliche Informationen dürfen beliebig strukturiert sein. Ein Handoff fordere ich später separat an.\nEine bewusste Ablage für späteres Lernen ist ein vollständiger Verarbeitungsschritt. Beim Einordnen muss ich nicht erst eine Feynman-Session durchlaufen. Frage nur, was für meine Entscheidung nötig ist.\nWenn ich ein Highlight in eine Lernsammlung aufnehmen will, erhalte seine Readwise-ID, Quelle und Quellnotiz. Weitere Lernwiederholungen, Erklärungen, Verbindungen, Eselsbrücken und Wegwerf-Ankis gehören in den späteren Lernchat und dessen Zielsystem.\nDieser Workflow benötigt kein AnkiConnect. Liefere im Workbench-Handoff anki: null. Falls ich doch den direkten Anki-Schritt möchte, weise auf den anderen Workflow hin.\n\n## Ausgewählte Highlights\n{{HIGHLIGHTS_JSON_OR_MARKDOWN}}\n\nBeginne mit dem ersten Highlight und frage, wie ich es verwenden möchte.";
var START_TEMPLATE="# Readwise Workbench · Dialog mit AnkiConnect\nDu begleitest meine initiale Verarbeitung von {{COUNT}} Readwise-Highlights. Die Workbench dokumentiert, was ich mit jedem Highlight gemacht habe und wo das Ergebnis liegt. Sie plant kein späteres Lernen.\nArbeite mit mir an einem Highlight oder einem sinnvollen kleinen Zusammenhang nach dem anderen. Readwise-Tags sind Kontext, keine verbindliche Entscheidung. Die stabile Einheit ist die Readwise-Highlight-ID.\nMögliche Verwendungen sind unter anderem: in eine Lernsammlung aufnehmen, einen bestehenden Eintrag ergänzen, eine Reflexion oder Atomic Note ausarbeiten, Schreibmaterial nutzen, eine Sprintnotiz aktualisieren, eine Aufgabe anlegen, frei anders verwenden, vertagen oder verwerfen. Die Liste ist offen. Mehrere Aktionen sind erlaubt, wenn sie unterschiedliche Zwecke erfüllen.\nVor externen Writes: Ermittle mit mir das konkrete Ziel. Lies dessen aktuelle Regeln und gegebenenfalls meinen von mir genannten Database Index. Suche vorhandene Einträge, bevor du neue anlegst. Führe nur beauftragte Writes aus und prüfe ihr Ergebnis. Erfinde keine Properties, Fakten, Nutzeräußerungen oder erfolgreichen Writes. Ohne passenden Zugriff bleibt es ein Entwurf.\nMerke pro Highlight meine Entscheidung, tatsächliche Aktionen und Ergebnisse mit Zielreferenzen. Eigene Gedanken nur dokumentieren, wenn ich sie wirklich geäußert habe. Zusätzliche Informationen dürfen beliebig strukturiert sein. Ein Handoff fordere ich später separat an.\nFür eine direkte Anki-Karte soll mein Verständnis zuerst sichtbar werden. Bitte mich bei Bedarf um eigene Worte, ein Beispiel oder eine Abgrenzung. Hilf bei konkreten Lücken; nach einer Erklärung kann ich erneut selbst erklären. Keine starre Fragenbatterie.\nEntscheide anschließend mit mir, ob eine Karte wirklich sinnvoll ist oder ein anderes Ziel besser passt. Eine Karte prüft genau einen Lernpunkt und muss alleine verständlich sein. Notwendiger Kontext gehört in die Frage. Kennzeichne Quellenpositionen als solche.\nBewahre Frage, Antwort, vollständige relevante Quellenpassage, vorhandene Readwise-Notiz, verfügbare Medieninformationen und Tags. Eigene Erklärungen und Eselsbrücken nur übernehmen, wenn sie tatsächlich entstanden sind.\nDirekte Anki-Karten als vollständigen Payload für die Workbench vorbereiten. Der Chat schreibt sie nicht selbst via AnkiConnect. Review, Freigabe und tatsächliche Anlage folgen in der App am Laptop. Andere Verwendungen bleiben möglich.\n\n## Ausgewählte Highlights\n{{HIGHLIGHTS_JSON_OR_MARKDOWN}}\n\nBeginne mit dem ersten sinnvollen Kandidaten.";
var HANDOFF_TEMPLATE="Bilanziere jetzt diese Verarbeitungssession. Gib ausschließlich gültiges JSON nach dem unten eingefügten App-Vertrag zurück.\nFühre in diesem Schritt keine weiteren Writes aus. Nenne nur tatsächlich erfolgte Aktionen und echte Ergebnisreferenzen. Unbearbeitete Highlights ausdrücklich vertagen. Falls ein Write scheiterte, verwende error und benenne das Problem. Eine erfolgreiche Aufnahme in eine Lernsammlung bedeutet verarbeitet, nicht gelernt.\nBewahre meine tatsächliche Entscheidung, eigene Gedanken und zusätzliche Informationen möglichst vollständig. Freie Verwendungszwecke und Zusatzfelder sind ausdrücklich erlaubt.\n{{HANDOFF_SCHEMA}}";
var TEMPLATE_VARIABLES=['COUNT','SESSION_ID','WORKFLOW','HIGHLIGHTS_JSON_OR_MARKDOWN','CHECKPOINT','CHAT_URL','HANDOFF_SCHEMA'];
function defaultWorkflows(){return [{id:'notion',start_template:NOTION_TEMPLATE,handoff_template:HANDOFF_TEMPLATE,updated_at:null},{id:'anki',start_template:START_TEMPLATE,handoff_template:HANDOFF_TEMPLATE,updated_at:null}];}
function workflowId(id){return id==='anki'?'anki':'notion';}
function workflowSnapshot(w){return {id:w.id,start_template:w.start_template,handoff_template:w.handoff_template};}
function validateTemplate(text,label){assert(typeof text==='string'&&text.trim(),label+' darf nicht leer sein.');assert(text.length<=100000,label+' ist zu lang.');var unknown=Array.from(text.matchAll(/\{\{([A-Z][A-Z0-9_]*)\}\}/g)).map(function(m){return m[1];}).filter(function(k){return !TEMPLATE_VARIABLES.includes(k);});assert(!unknown.length,'Unbekannte Variable: '+unknown.join(', '));}
function validateWorkflow(w,snapshot){exact(w,snapshot?['id','start_template','handoff_template']:['id','start_template','handoff_template','updated_at'],'Workflow');assert(['notion','anki'].includes(w.id),'Unbekannter Workflow.');validateTemplate(w.start_template,'Startprompt');validateTemplate(w.handoff_template,'Handoff-Zusatz');if(!snapshot)assert(w.updated_at===null||validDate(w.updated_at),'Vorlagenzeit ungültig.');}
function upgradeState(raw){var out=clone(raw);if(out&&out.format===FORMAT&&out.version===2){
  var legacy=!Object.prototype.hasOwnProperty.call(out,'workflows');if(legacy)out.workflows=defaultWorkflows();
  if(legacy&&Array.isArray(out.sessions))out.sessions.forEach(function(s){
    if(!Object.prototype.hasOwnProperty.call(s,'workflow'))s.workflow=workflowSnapshot(defaultWorkflows()[1]);
    if(!Object.prototype.hasOwnProperty.call(s,'handoff_imported_at'))s.handoff_imported_at=null;
  });
}return out;}
function required(obj,keys,label){assert(obj&&typeof obj==='object'&&!Array.isArray(obj),label+' muss ein Objekt sein.');assert(keys.every(function(k){return Object.prototype.hasOwnProperty.call(obj,k);}),label+': Pflichtfelder fehlen.');}

function now(){return new Date().toISOString();}
function uid(prefix){return prefix+'_'+crypto.randomUUID().replace(/-/g,'');}
function clone(x){return JSON.parse(JSON.stringify(x));}
function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function safeUrl(v){try{var u=new URL(v);return /^https?:$/.test(u.protocol)?u.href:'';}catch(e){return '';}}
function plain(v){return typeof v==='string'?v:'';}
function assert(v,msg){if(!v)throw new Error(msg);}
function canonical(x){if(Array.isArray(x))return '['+x.map(canonical).join(',')+']';if(x&&typeof x==='object')return '{'+Object.keys(x).sort().map(function(k){return JSON.stringify(k)+':'+canonical(x[k]);}).join(',')+'}';return JSON.stringify(x);}
function same(a,b){return canonical(a)===canonical(b);}
function stamp(o){o.updated_at=now();return o;}
function unique(a){return Array.from(new Set(a));}
function dateText(v){return v?new Date(v).toLocaleString('de-DE',{dateStyle:'short',timeStyle:'short'}):'Noch nicht';}
function defaultState(){return {format:FORMAT,version:2,workspace_id:uid('space'),created_at:now(),intake:{start_at:new Date().toISOString().slice(0,10)+'T00:00:00.000Z',checkpoint:null,last_full:null},candidates:[],sessions:[],deletedIds:{},workflows:defaultWorkflows()};}
function defaultConfig(){return {readwiseToken:'',gistToken:'',gistId:'',deviceName:'',ankiEndpoint:'http://127.0.0.1:8765',ankiKey:'',ankiDeck:'0000 Readwise Ankis',ankiModel:'Mastery-Notiztyp',feynmanField:'',mnemonicField:'',theme:'light'};}
function byId(list,id){return list.find(function(x){return x.id===id;});}
function candidate(id){return byId(S.candidates,id);}
function session(id){return byId(S.sessions,id);}
function allCards(state){return (state||S).sessions.flatMap(function(s){return s.cards||[];});}
function getCard(id){return allCards().find(function(c){return c.id===id;});}
function usable(c){return c&&!S.deletedIds['candidates:'+c.id]&&!c.source.deleted;}
function associated(state,c){return state.sessions.filter(function(s){return !state.deletedIds['sessions:'+s.id]&&s.items.some(function(i){return i.highlight_id===c.id&&i.generation===c.generation;});}).sort(function(a,b){return a.created_at.localeCompare(b.created_at)||a.id.localeCompare(b.id);});}
function candidateStatus(c,state){state=state||S;var ss=associated(state,c),s=ss[ss.length-1];if(!s)return c.generation?'resurfaced':'new';if(!s.handoff)return s.phase;var r=s.handoff.items.find(function(i){return i.highlight_id===c.id;});var cards=s.cards.filter(function(x){return x.highlight_id===c.id;});if(cards.some(function(x){return x.status==='error'||x.status==='missing';}))return 'error';if(cards.some(function(x){return x.status!=='synced';}))return 'pending_anki';return r.outcome;}
function selectable(c){var st=candidateStatus(c);return usable(c)&&(['new','resurfaced'].includes(st)||(UI.includeDeferred&&['deferred','error'].includes(st)&&!pendingFor(c.id)));}
function pendingFor(id){return allCards().some(function(c){return c.highlight_id===id&&c.status!=='synced';});}
function inboxSortMode(value){return INBOX_SORTS.some(function(x){return x[0]===value;})?value:'newest';}
function highlightDate(c){return validDate(c.source.highlighted_at)?c.source.highlighted_at:validDate(c.source.created_at)?c.source.created_at:null;}
function compareDates(a,b,ascending){var av=validDate(a)?Date.parse(a):null,bv=validDate(b)?Date.parse(b):null;if(av===null)return bv===null?0:1;if(bv===null)return -1;return ascending?av-bv:bv-av;}
function compareCandidates(a,b){
  var mode=inboxSortMode(UI.inboxSort),order=0;
  if(mode==='imported')order=compareDates(a.first_seen_at,b.first_seen_at,false);
  if(mode==='resurfaced')order=Number(b.generation>0)-Number(a.generation>0);
  return order||compareDates(highlightDate(a),highlightDate(b),mode==='oldest')||(a.id<b.id?-1:a.id>b.id?1:0);
}
function eligible(){return S.candidates.filter(selectable).sort(compareCandidates);}
function setInboxSort(value){if(BUSY||LOCKED)return;UI.inboxSort=inboxSortMode(value);saveUi();render();}

function handoffContract(s){
  var example={type:'readwise-workbench-handoff-v2',version:'2.1',session:{session_id:s.id,input_count:s.items.length,completed_at:null},items:s.items.map(function(i){return {highlight_id:i.highlight_id,outcome:'deferred',route:'defer',processed_at:null,decision:'',user_processing:{own_words:null},actions:[],artifacts:[],anki:null,notes:'',extra:{}};}),summary:{processed:0,discarded:0,deferred:s.items.length,anki_ready:0,notion_artifacts:0},errors:[]};
  var text='App-Vertrag · Handoff 2.1\n'+JSON.stringify(example,null,2)+'\nDas Beispiel vertagt alle Highlights. Ersetze die Ergebnisse und Zähler durch die tatsächliche Bilanz. Jede vorgegebene Highlight-ID genau einmal, keine fremde ID. Session-ID und input_count nicht ändern.\n'+
  'outcome ist processed, discarded, deferred oder error. route ist eine freie Bezeichnung, z. B. feynman_collection, sprint_update, time_sector_task oder eine neue Verwendung. Bei discarded: route discard, keine Artefakte, erledigten Aktionen oder Karten. Bei deferred: route defer, anki null. Bei error: Grund in notes und errors, anki null.\n'+
  'processed bedeutet initial verarbeitet, nicht gelernt. Es braucht mindestens ein echtes Artefakt, eine ausdrücklich erledigte Aktion oder im Anki-Workflow einen vollständigen Kartenpayload. Geplante oder gescheiterte Aktionen sind noch kein vollständiger Erfolg. Keine erfolgreichen Writes erfinden.\n'+
  'actions ist optional. Eine Aktion hat mindestens description (konkret, nicht leer) und status (completed, planned oder failed). Weitere freie Felder, z. B. system, target, action, url, id und verschachtelte details, bleiben vollständig erhalten. url nur echte HTTP(S)-URL oder null. Auch eine bewusst abgeschlossene Verarbeitung ohne externes Artefakt kann als completed-Aktion mit Beschreibung dokumentiert werden.\n'+
  'artifacts enthält tatsächliche Ergebnisreferenzen mit system, target, action (freie Texte), url (echte HTTP(S)-Adresse; bei system notion eine Notion-URL) und id (bekannt oder null). Beispielstruktur: {"system":"notion","target":"Name des tatsächlichen Ziels","action":"updated","url":"<echte Notion-URL>","id":null}. Keine Entwürfe als erfolgte Writes ausgeben.\n'+
  'user_processing darf {} sein und frei ergänzt werden. Bekannte Felder own_words, key_distinction, open_question, possible_intermediate_packet_use sind Text oder null. Nur tatsächliche Nutzeräußerungen. decision und extra sowie weitere Felder dürfen frei strukturiert werden. Unbekannte Felder sind erlaubt, auch auf Root-, Session- und Artefaktebene.\n'+
  'completed_at und optional processed_at: tatsächlicher bekannter Zeitpunkt, sonst null; kein Datum erfinden. Die App erfasst die Importzeit separat. summary zählt processed/discarded/deferred nach outcome, anki_ready nach Highlights mit Payload und notion_artifacts nach eindeutigen URLs in artifacts mit system notion. Zusätzliche summary-Felder erlaubt.\n'+
  'Keine neuen Writes während dieser Bilanz. Unbearbeitete Highlights deferred, Fehler nachvollziehbar. Inhalte sind Klartext, kein ausführbares HTML.';
  if(s.workflow.id==='notion')return text+'\nWorkflow ohne AnkiConnect: anki muss für jedes Item null bleiben. Späteres Lernen gehört ins Zielsystem.';
  return text+'\nAnki-Workflow: Karten nur für outcome processed. Bei route anki ist ein Payload erforderlich; Karten können auch zusätzlich zu anderen Ergebnissen entstehen.\nEinzelkarte statt anki:null:\n'+JSON.stringify({status:'ready_for_sync',target_deck:null,target_model:null,core_fields:{Frage:'<eindeutige fertige Frage>',Antwort:'<fertige Antwort>',Zitat:'<vollständige relevante Quellenpassage>',Notizen:'<vorhandene Notiz oder leer>',Medien:'<vorhandene Medieninformation oder leer>',Tags:'<Tags mit Leerzeichen getrennt>'},learning_fields:{feynman_explanation:null,mnemonic:null}},null,2)+'\nMehrere Karten: anki = {"status":"ready_for_sync","cards":[...]} mit je target_deck,target_model,core_fields,learning_fields. Keine erfundenen Decks/Modelle: unbekannt = null. Frage, Antwort und Zitat dürfen nicht leer sein. Review und tatsächlicher Anki-Write erfolgen erst in der App.';
}

function sessionCard(s){return '<article class="item"><div class="row between"><div><h3>Session · '+dateText(s.created_at)+'</h3><small>'+s.items.length+' Highlights · '+s.cards.length+' Karten</small></div><button onclick="go(\'sessions\',\''+s.id+'\')">'+(sessionDone(s)?'Ansehen':'Fortsetzen →')+'</button></div><p class="mono">'+esc(s.id)+'</p>'+pill(s.handoff?(sessionDone(s)?'processed':'pending_anki'):s.phase)+'</article>';}
function renderSessions(){var s=session(UI.sessionId);if(!s)return '<div class="eyebrow">02 · Verarbeiten</div><h1>Deine Sessions</h1><p class="lead">Kleine, feste Ausschnitte. Zwischenstände und Quellen reisen mit – der Chatverlauf nur, soweit du ihn hier sicherst.</p><div class="panel">'+(S.sessions.slice().sort(function(a,b){return b.created_at.localeCompare(a.created_at);}).map(sessionCard).join('')||empty('Wähle im Eingang einen oder mehrere Gedanken.'))+'</div>';var prefix='session.'+s.id+'.';
  return '<button onclick="go(\'sessions\')">← Alle Sessions</button><div style="margin-top:24px" class="eyebrow">Verwenden → Ergebnis → Protokoll</div><h1>Session · '+dateText(s.created_at)+'</h1><p class="mono">'+esc(s.id)+'</p><p>'+pill(s.handoff?(sessionDone(s)?'processed':'pending_anki'):s.phase)+' · '+s.items.length+' feste Highlights</p><p class="muted">'+esc(WORKFLOW_LABELS[s.workflow.id])+' · Vorlage beim Sessionstart eingefroren</p><details><summary>Quellen & bisherige Zuordnungen</summary>'+s.items.map(function(i){return '<article class="item">'+sourceHtml(i.source,true)+(i.known_anki_ids.length?'<p class="notice">Bestehende Anki-Notizen: '+esc(i.known_anki_ids.join(', '))+'</p>':'')+'</article>';}).join('')+'</details>'+
  (!s.handoff?'<section class="panel"><div class="panel-head"><div><span class="step">1 / Dialog</span><h2>Wie möchtest du es verwenden?</h2><p class="muted">In einen neuen Chat einfügen. Für externe Aktionen braucht er Zugang zum jeweiligen Zielsystem.</p></div><button class="primary" onclick="copyText(buildStartPrompt(session(\''+s.id+'\')))">Prompt 1 kopieren</button></div><details><summary>Sessionprompt ansehen</summary><pre>'+esc(buildStartPrompt(s))+'</pre></details></section><section class="panel"><span class="step">Zwischen Geräten</span><h2>Wo stehst du gerade?</h2><p class="muted">Speichere eigene Erklärung, Entscheidungen, offene Fragen und bereits bestätigte Ziel-URLs. Danach Gist abgleichen. Auf dem nächsten Gerät erst abgleichen, dann fortsetzen.</p>'+field('Zwischenstand / bisheriger Dialog',prefix+'checkpoint_text',s.checkpoint_text,'textarea')+field('Chat-Link (optional)',prefix+'chat_url',s.chat_url)+'<div class="actions"><button onclick="saveSessionContext(\''+s.id+'\',false)">Zwischenstand speichern</button><button onclick="saveSessionContext(\''+s.id+'\',true)">Dialog beendet · Handoff ausstehend</button></div></section><section class="panel"><div class="panel-head"><div><span class="step">2 / Bilanz</span><h2>Entscheidung zurückbringen.</h2><p class="muted">Prompt 2 in denselben Verarbeitungs-Chat senden. Er bilanziert alle IDs und löst keine neuen Notion-Writes aus.</p></div><button onclick="copyText(buildHandoffPrompt(session(\''+s.id+'\')))">Prompt 2 kopieren</button></div><details><summary>Handoff-Prompt ansehen</summary><pre>'+esc(buildHandoffPrompt(s))+'</pre></details>'+field('JSON-Handoff aus dem Chat',prefix+'handoff_draft',s.handoff_draft,'textarea')+'<div class="actions"><button onclick="saveHandoffDraft(\''+s.id+'\')">Entwurf speichern</button><button class="primary" onclick="previewHandoff(\''+s.id+'\')">Prüfen & übernehmen</button></div><p class="muted">Noch keine Anki-Schreibaktion. Nicht bearbeitete Highlights müssen ausdrücklich vertagt werden.</p></section>':'<section class="panel"><span class="step">Handoff gespeichert</span><h2>Die Session ist bilanziert.</h2>'+handoffHtml(s.handoff)+(s.cards.length?'<button class="primary" onclick="go(\'anki\')">'+s.cards.length+' Karten prüfen →</button>':'')+'<details><summary>Gespeichertes JSON</summary><pre>'+esc(JSON.stringify(s.handoff,null,2))+'</pre></details><button onclick="downloadJson(\''+s.id+'-handoff.json\',session(\''+s.id+'\').handoff)">Handoff exportieren</button><details><summary>Dialog-Zwischenstand</summary><pre>'+esc(s.checkpoint_text||'Keiner gespeichert.')+'</pre>'+link(s.chat_url,'Chat öffnen ↗')+'</details></section>');}
async function saveSessionContext(id,finished){var s=session(id),p='session.'+id+'.',txt=val(p+'checkpoint_text',s.checkpoint_text),url=val(p+'chat_url',s.chat_url).trim();return run('Zwischenstand wird gespeichert …',async function(){assert(!url||safeUrl(url),'Chat-Link muss eine HTTP(S)-Adresse sein.');var out=clone(S),x=byId(out.sessions,id);assert(!x.handoff,'Session ist bereits bilanziert.');x.checkpoint_text=txt;x.chat_url=url;if(finished)x.phase='awaiting_handoff';stamp(x);await commit(out);delete DRAFTS[p+'checkpoint_text'];delete DRAFTS[p+'chat_url'];tell('Zwischenstand lokal gespeichert. Für das nächste Gerät jetzt Gist abgleichen.');});}
async function saveHandoffDraft(id){var key='session.'+id+'.handoff_draft',text=val(key,session(id).handoff_draft);return run('Entwurf wird gespeichert …',async function(){var out=clone(S),s=byId(out.sessions,id);assert(!s.handoff,'Session ist bereits bilanziert.');s.handoff_draft=text;stamp(s);await commit(out);delete DRAFTS[key];tell('Entwurf gespeichert – noch nicht importiert.');});}
function handoffHtml(h){return h.items.map(function(i){return '<article class="item"><div class="row">'+pill(i.outcome)+'<b>'+esc(i.route)+'</b><small>Highlight '+esc(i.highlight_id)+'</small></div>'+
  (typeof i.decision==='string'&&i.decision?'<p><b>Entscheidung:</b> '+esc(i.decision)+'</p>':'')+
  (i.user_processing.own_words?'<p>'+esc(i.user_processing.own_words)+'</p>':'')+(i.user_processing.open_question?'<p class="muted">Offen: '+esc(i.user_processing.open_question)+'</p>':'')+
  (i.actions||[]).map(function(a){return '<p><span class="pill">'+esc({completed:'Erledigt',planned:'Geplant',failed:'Fehlgeschlagen'}[a.status])+'</span> '+esc(a.description)+(a.url?' · '+link(a.url,'Ergebnis ↗'):'')+'</p>';}).join('')+
  i.artifacts.map(function(a){return '<p>'+esc(a.system)+' · '+link(a.url,a.target+' · '+a.action+' ↗')+'</p>';}).join('')+
  (i.anki?'<p>'+cardsFromAnki(i.anki).length+' Karte(n) im Handoff. Aktuellen Sync-Status im Anki-Review / Protokoll prüfen.</p>':'')+
  (i.notes?'<p class="muted">'+esc(i.notes)+'</p>':'')+'<details><summary>Vollständiger Eintrag einschließlich Zusatzfeldern</summary><pre>'+esc(JSON.stringify(i,null,2))+'</pre></details></article>';}).join('');}

async function previewHandoff(id){
  var s=session(id),key='session.'+id+'.handoff_draft',text=val(key,s.handoff_draft);
  return run('Handoff wird validiert …',async function(){
    var h=validateHandoff(text,s);
    if(s.handoff){assert(same(s.handoff,h),'Diese Session hat bereits ein anderes Handoff. Kein stilles Überschreiben.');tell('Dieses Handoff ist bereits importiert. Keine Änderung.');return;}
    if(!await ask('Handoff übernehmen?',handoffHtml(h)+'<div class="notice">Die App prüft IDs, Schema, Zähler und Referenzformat, nicht den Inhalt in Notion. Bestätige nur tatsächlich erfolgte Writes. Anki-Karten werden zunächst Entwürfe.</div>'))return;
    // Timestamp the accepted import, not the potentially much earlier preview.
    var r=applyHandoff(S,id,h);if(r.noop){tell('Dieses Handoff ist bereits importiert. Keine Änderung.');return;}
    await commit(r.state);delete DRAFTS[key];tell(r.state.sessions.find(function(x){return x.id===id;}).cards.length?'Handoff protokolliert. Anki-Entwürfe warten auf deine Freigabe.':'Handoff protokolliert. Die initiale Verarbeitung ist bilanziert.');
  });
}
function renderAnki(){var pending=allCards().filter(function(c){return c.status!=='synced';});return '<div class="eyebrow">03 · Festigen</div><h1>Nur was du lernen willst.</h1><p class="lead">Handoff ist nicht Anki-Sync. Prüfe die Formulierungen und gib die Karten bewusst frei.</p><div class="row"><button class="primary" onclick="syncAnki()">Freigegebene Karten synchronisieren</button><button onclick="reconcileAnki()">Bestätigte Notizen prüfen</button></div><p class="muted">'+pending.length+' offen · '+allCards().filter(function(c){return c.status==='synced';}).length+' in Anki bestätigt</p>'+ (pending.map(function(c){var p='card.'+c.id+'.',src=cardSource(c);return '<section class="panel card-editor"><div class="row between">'+pill(c.status)+'<small>Highlight '+c.highlight_id+'</small></div><p class="source">'+esc(src.title)+'</p>'+field('Frage',p+'Frage',c.payload.core_fields.Frage,'textarea')+field('Antwort',p+'Antwort',c.payload.core_fields.Antwort,'textarea')+field('Notizen',p+'Notizen',c.payload.core_fields.Notizen,'textarea')+field('Tags (mit Leerzeichen trennen)',p+'Tags',c.payload.core_fields.Tags)+'<details><summary>Quelle & Lernschicht</summary>'+sourceHtml(src,true)+'<p><b>Eigene Erklärung:</b> '+esc(c.payload.learning_fields.feynman_explanation||'—')+'</p><p><b>Eselsbrücke:</b> '+esc(c.payload.learning_fields.mnemonic||'—')+'</p><p class="muted">Die vollständige Originalquelle, Quellnotiz und stabile Readwise-ID bleiben erhalten. Lernschicht ohne separate Feldzuordnung: Notizen.</p></details>'+ (c.error?'<div class="notice error-text">'+esc(c.error)+'</div>':'')+'<label class="check-label"><input type="checkbox" data-draft="'+p+'allow_existing" '+(dv(p+'allow_existing',c.allow_existing)?'checked':'')+'> Zusätzliche Karte auch dann erlauben, wenn für dieses Highlight ältere Anki-Notizen existieren.</label><div class="actions"><button onclick="saveCard(\''+c.id+'\',false)">Als Entwurf speichern</button><button class="primary" onclick="saveCard(\''+c.id+'\',true)">Prüfung speichern & freigeben</button>'+(c.status==='missing'?'<button onclick="releaseMissing(\''+c.id+'\')">Fehlende Karte neu freigeben …</button>':'')+'</div></section>';}).join('')||'<div class="panel">'+empty('Keine offenen Karten. Ein verarbeitetes Highlight darf auch ohne Anki enden.')+'</div>');}
async function saveCard(id,approved){var c=getCard(id),p='card.'+id+'.',f={};['Frage','Antwort','Notizen','Tags'].forEach(function(k){f[k]=val(p+k,c.payload.core_fields[k]);});var allow=!!val(p+'allow_existing',c.allow_existing);return run('Kartenprüfung wird gespeichert …',async function(){var out=clone(S),s=out.sessions.find(function(x){return byId(x.cards,id);}),k=byId(s.cards,id);assert(k.status!=='synced','Bestätigte Karten hier nicht überschreiben.');Object.assign(k.payload.core_fields,f);validateCardPayload(k.payload);k.approved=approved;k.allow_existing=allow;if(k.status!=='missing')k.status=approved?'approved':'draft';stamp(k);stamp(s);await commit(out);clearDraft(p);tell(approved?'Freigegeben. Erst der Anki-Sync legt die Karte an.':'Entwurf gespeichert.');});}
function processingLog(state){state=state||S;var events=[];state.sessions.forEach(function(s){if(!s.handoff)return;s.handoff.items.forEach(function(i){var source=s.items.find(function(x){return x.highlight_id===i.highlight_id;}),context=clone(s.handoff);delete context.items;events.push({
  event_id:s.id+':'+i.highlight_id,session_id:s.id,highlight_id:i.highlight_id,generation:source.generation,workflow:s.workflow.id,
  processed_at:i.processed_at||s.handoff.session.completed_at||null,imported_at:s.handoff_imported_at,session_started_at:s.created_at,
  source:clone(source.source),result:clone(i),handoff_context:context,
  anki_status:s.cards.filter(function(c){return c.highlight_id===i.highlight_id;}).map(function(c){return {card_id:c.id,status:c.status,note_id:c.note_id,synced_at:c.synced_at};})
});});});return events.sort(function(a,b){return compareDates(a.processed_at||a.imported_at||a.session_started_at,b.processed_at||b.imported_at||b.session_started_at,false)||a.event_id.localeCompare(b.event_id);});}
function filteredLog(){var query=(UI.historyFilter||'').toLowerCase();return processingLog().filter(function(e){return !query||JSON.stringify(e).toLowerCase().includes(query);});}
function exportProcessingLog(){downloadJson('readwise-workbench-protokoll-'+now().slice(0,10)+'.json',{type:'readwise-workbench-processing-log',version:'1',workspace_id:S.workspace_id,exported_at:now(),filter:UI.historyFilter||null,events:filteredLog()});tell('Verarbeitungsprotokoll exportiert · Quellen und freie Zusatzfelder enthalten.');}
function renderHistory(){var events=filteredLog();return '<div class="eyebrow">Gedächtnis der Workbench</div><h1>Verarbeitungs<wbr>protokoll</h1><p class="lead">Wann hast du welches Highlight wie und wo initial verwendet? Jede bilanzierte Verarbeitung bleibt erhalten, auch wenn du das Highlight später wieder aufgreifst.</p><div class="row between"><label>Suche im Protokoll <input id="historyFilter" value="'+esc(UI.historyFilter||'')+'" onchange="UI.historyFilter=this.value;render()" placeholder="ID, Quelle, Ziel oder eigener Gedanke"></label><button onclick="exportProcessingLog()">Protokoll als JSON exportieren</button></div><p class="muted">'+events.length+' Einträge · Export enthält die angezeigte Auswahl mit allen Zusatzfeldern.</p><div class="panel">'+(events.map(function(e){var c=candidate(e.highlight_id),can=c&&['processed','discarded','deferred','error'].includes(candidateStatus(c))&&!pendingFor(c.id)&&!c.source.deleted;return '<article class="item"><p class="source">Verarbeitet: '+(e.processed_at?dateText(e.processed_at):'Zeitpunkt nicht angegeben')+' · Importiert: '+(e.imported_at?dateText(e.imported_at):'Altbestand · Zeitpunkt unbekannt')+'</p><p><b>'+esc(e.source.title)+'</b> · '+esc(e.highlight_id)+' · Runde '+(e.generation+1)+'</p><p class="source">'+esc(WORKFLOW_LABELS[e.workflow])+'</p>'+handoffHtml({items:[e.result]})+
  (e.anki_status.length?'<p class="muted">Anki aktuell: '+e.anki_status.map(function(c){return esc(LABELS[c.status]||c.status)+(c.note_id?' · Notiz '+c.note_id:'');}).join(', ')+'</p>':'')+
  '<details><summary>Quelle zum Verarbeitungszeitpunkt</summary>'+sourceHtml(e.source,true)+'</details><div class="actions"><button onclick="go(\'sessions\',\''+e.session_id+'\')">Entscheidung ansehen</button>'+(can?'<button onclick="resurface(\''+e.highlight_id+'\')">Bewusst wieder aufgreifen</button>':'')+'</div></article>';}).join('')||empty('Noch keine passenden Protokolleinträge.'))+'</div>';}

async function resurface(id){return run('Wieder aufgreifen …',async function(){assert(!pendingFor(id),'Erst offene Anki-Karten klären.');var c=candidate(id);assert(['processed','discarded','deferred','error'].includes(candidateStatus(c))&&!c.source.deleted,'Kandidat noch aktiv oder Quelle gelöscht.');if(!await ask('Diesen Gedanken erneut aufgreifen?','<p>Gleiche Highlight-ID, neue Verarbeitungsrunde. Bisherige Entscheidungen und Anki-Notizen bleiben erhalten.</p>'))return;var out=clone(S),x=byId(out.candidates,id);x.generation++;stamp(x);await commit(out);tell('Im Eingang wieder verfügbar.');});}
function renderSettings(){var start=S.intake.start_at.slice(0,10);return '<div class="eyebrow">Lokal zuerst</div><h1>Einstellungen</h1><p class="lead">Verbindungen sind gerätespezifisch. Inhalte werden nur auf deinen ausdrücklichen Abruf synchronisiert.</p>'+renderWorkflowSettings()+'<section class="panel"><h2>Readwise · ein neuer Eingang</h2>'+field('Access Token','config.readwiseToken',C.readwiseToken,'password')+'<label class="field">Neue Highlights seit (UTC)<input id="startDate" type="date" value="'+start+'" '+(S.candidates.length||S.intake.checkpoint?'disabled':'')+'></label><p class="muted">Neue Highlights ohne Workflow-Tag. Ältere Highlights nur über das exakte Tag <b>Workbench</b>. Beim ersten Abruf werden Exportseiten gelesen, aber nur Kandidaten behalten. Readwise wird nie beschrieben.</p><div class="actions"><button onclick="saveSettings()">Einstellungen speichern</button><button onclick="readwiseLoad(true)">Vollständig abgleichen</button></div><p class="source">Letzter Abruf: '+dateText(S.intake.checkpoint)+'</p></section><section class="panel"><h2>Gerätewechsel · verschlüsselter Gist</h2><p>Erst auf Gerät A den Zwischenstand speichern und abgleichen. Dann auf Gerät B denselben Gist laden. Nicht gleichzeitig an derselben Session arbeiten.</p>'+field('GitHub-Token (Gist-Schreibrecht)','config.gistToken',C.gistToken,'password')+field('Gist-ID (bestehender geheimer Gist)','config.gistId',C.gistId)+field('Gerätename (nur lokal)','config.deviceName',C.deviceName)+'<p class="muted">Datei: <code>'+GIST_FILE+'</code>. Andere Gist-Dateien bleiben unangetastet. Ein geheimer Gist ist nicht privat: der App-State wird zusätzlich verschlüsselt.</p><label class="field">Sync-Passphrase (mindestens 10 Zeichen)<input id="passphraseInput" type="password" autocomplete="off" placeholder="Auf allen Geräten dieselbe Passphrase"></label><div class="actions"><button onclick="saveSettings()">Verbindung speichern</button><button onclick="unlockSync()">Passphrase entsperren</button><button class="primary" onclick="syncCloud()">Jetzt abgleichen</button></div><p class="source">'+(passphrase?'Passphrase für diesen Tab entsperrt.':'Passphrase wird nicht gespeichert.')+' Bei Verlust gibt es keine Entschlüsselung; JSON-Backup separat sichern. Abgleich enthält auch Quellen, gespeicherte Dialog-Zwischenstände, persönliche Vorlagen, vollständige Handoffs und Karten.</p></section><section class="panel"><h2>AnkiConnect · am Laptop</h2>'+field('Endpunkt','config.ankiEndpoint',C.ankiEndpoint)+field('API-Key (optional)','config.ankiKey',C.ankiKey,'password')+'<div class="grid">'+field('Zieldeck','config.ankiDeck',C.ankiDeck)+field('Notiztyp','config.ankiModel',C.ankiModel)+'</div><details><summary>Optionale Lernfelder</summary><p class="muted">Leer lassen: Inhalte werden beschriftet an Notizen angehängt. Nur echte, im Notiztyp vorhandene Felder eintragen.</p>'+field('Feld für eigene Erklärung','config.feynmanField',C.feynmanField)+field('Feld für Eselsbrücke','config.mnemonicField',C.mnemonicField)+'</details><div class="actions"><button onclick="saveSettings()">Einstellungen speichern</button><button onclick="testAnki()">Verbindung & Notiztyp prüfen</button><button onclick="scanAnki()">Bestehende Anki-Karten lesen</button></div><details><summary>Verbindungshilfe / CORS</summary><p>Anki Desktop auf diesem Gerät starten. AnkiConnect muss in <code>webCorsOriginList</code> diesen Ursprung erlauben (ohne URL-Pfad):</p><pre>'+esc(location.origin)+'</pre><p>Bind-Adresse <code>127.0.0.1</code> belassen. Kein Wildcard-CORS und keine Freigabe ins ganze Netzwerk nötig. Danach Anki neu starten. Gegebenenfalls Browser-Zugriff auf lokale Verbindungen erlauben.</p></details></section><section class="panel"><h2>Backup & lokale Darstellung</h2><p>JSON enthält auch persönliche Vorlagen und das Verarbeitungsprotokoll, aber keine Verbindungs-Tokens, Endpunkte oder Passphrase. Es ist unverschlüsselt: sicher aufbewahren.</p><div class="actions"><button onclick="exportBackup()">JSON-Backup exportieren</button><button onclick="document.getElementById(\'backupFile\').click()">2.x-Backup importieren …</button><button onclick="recoveryExport()">Letzten Recovery-Stand exportieren</button></div><input type="file" id="backupFile" accept=".json,application/json" style="display:none" onchange="importBackup(this.files[0])"><label class="field" style="margin-top:20px">Darstellung<select data-draft="config.theme"><option value="light" '+(dv('config.theme',C.theme)==='light'?'selected':'')+'>Papier</option><option value="eink" '+(dv('config.theme',C.theme)==='eink'?'selected':'')+'>E-Ink / hoher Kontrast</option></select></label><button onclick="saveSettings()">Darstellung speichern</button><p class="source">Installieren über das Browsermenü. Unter HTTPS oder localhost läuft die PWA offline; externe Verbindungen brauchen Netz. Ein Update wird nach Schließen aller App-Tabs aktiv. Vorhandene 2.0-Daten werden beim Laden ergänzt; Handoffs und Karten bleiben erhalten. 1.x-Bestände werden nicht automatisch übernommen. Aktualisiere vor dem nächsten Gist-Abgleich alle Geräte auf 2.1.</p><p class="mono">Workspace '+esc(S.workspace_id)+'</p></section>';}
async function saveSettings(){var next=clone(C);Object.keys(C).forEach(function(k){next[k]=String(val('config.'+k,C[k])).trim();});var start=document.getElementById('startDate'),date=start?start.value:null;return run('Einstellungen werden gespeichert …',async function(){assert(safeUrl(next.ankiEndpoint),'Anki-Endpunkt muss eine HTTP(S)-Adresse sein.');if(date&&!S.candidates.length&&!S.intake.checkpoint){var state=clone(S);state.intake.start_at=date+'T00:00:00.000Z';await commit(state);}localStorage.setItem(CONFIG_KEY,JSON.stringify(next));C=next;clearDraft('config.');tell('Geräteeinstellungen gespeichert.');});}
function unlockSync(){var e=document.getElementById('passphraseInput');if(e.value.length<10){tell('Mindestens 10 Zeichen erforderlich.',true);return;}passphrase=e.value;e.value='';tell('Passphrase nur für diesen Tab entsperrt.');}
document.addEventListener('input',function(e){var key=e.target.dataset&&e.target.dataset.draft;if(key){DRAFTS[key]=e.target.type==='checkbox'?e.target.checked:e.target.value;renderDraftStatus();}});
window.addEventListener('beforeunload',function(e){if(BUSY||Object.keys(DRAFTS).length){e.preventDefault();e.returnValue='';}});
window.addEventListener('load',boot);
</script>
</body></html>
