<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rilke — Gedichtezettelkasten</title>
<style>
/* ═══ RESET & VARS ═══ */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f6f1dc;--bg-2:#f2e9c9;--surface:#fff9e6;--surface-2:#fffdf4;
  --border:#e6d9a8;--border-strong:#d4c27a;
  --ink:#2a2a2a;--ink-light:#6b6b5a;--ink-dim:#9a9278;
  --accent:#c9a227;--accent-soft:#e8d98a;
  --red:#c75c5c;--green:#6f9e6e;
  --neighbor-bg:#f4f8f0;--neighbor-border:#b8d4a8;
  --body:'Helvetica Neue',Helvetica,Arial,sans-serif;
  --mono:'Courier New',Courier,monospace;
  --serif:Georgia,serif;
  --r:6px;
  --shadow:0 1px 3px rgba(0,0,0,0.06);
  --shadow-lg:0 3px 10px rgba(0,0,0,0.08);
}
html{font-size:15px}
body{font-family:var(--body);background:var(--bg);color:var(--ink);min-height:100vh;line-height:1.5}
body.app-loading{pointer-events:none;cursor:progress}
input,textarea,select,button{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent);text-decoration:none}

/* ═══ LAYOUT ═══ */
.app-header{background:var(--surface-2);border-bottom:1px solid var(--border);padding:12px 20px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.app-title{font-size:1.25rem;font-weight:600;letter-spacing:0.02em;color:var(--ink)}
.app-title span{color:var(--ink-dim);font-weight:400;font-size:0.85rem;margin-left:6px}
.tab-bar{display:flex;gap:2px;margin-left:auto}
.tab-btn{padding:7px 16px;border:1px solid var(--border);background:transparent;border-radius:var(--r);font-size:0.85rem;color:var(--ink-light);transition:all .15s}
.tab-btn:hover{background:var(--bg-2)}
.tab-btn.active{background:var(--accent-soft);border-color:var(--border-strong);color:var(--ink);font-weight:500}

.main{display:flex;flex:1;min-height:0;height:calc(100vh - 52px)}
.panel{overflow-y:auto;padding:16px}
.panel-left{width:280px;min-width:220px;border-right:1px solid var(--border);background:var(--surface-2)}
.panel-center{flex:1;min-width:0;background:var(--bg)}
.panel-right{width:300px;min-width:240px;border-left:1px solid var(--border);background:var(--surface-2)}

/* ═══ CARDS ═══ */
.card-item{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:10px 12px;margin-bottom:8px;cursor:pointer;transition:all .12s;box-shadow:var(--shadow)}
.card-item:hover{border-color:var(--border-strong);box-shadow:var(--shadow-lg)}
.card-item.selected{border-color:var(--accent);background:var(--surface-2);box-shadow:0 0 0 2px var(--accent-soft)}
.card-item .sid{font-family:var(--mono);font-size:0.75rem;color:var(--ink-dim);margin-right:6px}
.card-item .text{font-size:0.9rem;color:var(--ink)}
.card-item .comment{font-size:0.8rem;color:var(--ink-dim);margin-top:4px;font-style:italic}
.child-indent{margin-left:16px;border-left:2px solid var(--border);padding-left:8px}

/* ═══ DETAIL PANEL ═══ */
.detail-section{margin-bottom:20px}
.detail-label{font-size:0.75rem;text-transform:uppercase;letter-spacing:0.06em;color:var(--ink-dim);margin-bottom:6px;font-weight:500}
.detail-text{font-size:1rem;line-height:1.6;white-space:pre-wrap}
.detail-comment{font-size:0.9rem;color:var(--ink-light);font-style:italic;line-height:1.5;white-space:pre-wrap}
.detail-meta{font-family:var(--mono);font-size:0.75rem;color:var(--ink-dim)}

/* ═══ BUTTONS ═══ */
.btn{padding:6px 14px;border:1px solid var(--border);background:var(--surface);border-radius:var(--r);font-size:0.82rem;color:var(--ink-light);transition:all .12s;display:inline-flex;align-items:center;gap:5px}
.btn:hover{background:var(--bg-2);border-color:var(--border-strong);color:var(--ink)}
.btn-accent{background:var(--accent-soft);border-color:var(--accent);color:var(--ink)}
.btn-accent:hover{background:var(--accent);color:#fff}
.btn-danger{border-color:var(--red);color:var(--red)}
.btn-danger:hover{background:var(--red);color:#fff}
.btn-sm{padding:4px 10px;font-size:0.78rem}
.btn-group{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}

/* ═══ FORMS ═══ */
.field{margin-bottom:12px}
.field label{display:block;font-size:0.78rem;text-transform:uppercase;letter-spacing:0.05em;color:var(--ink-dim);margin-bottom:4px;font-weight:500}
.field input,.field textarea,.field select{width:100%;padding:8px 10px;border:1px solid var(--border);border-radius:var(--r);background:var(--surface);font-size:0.9rem;outline:none;transition:border-color .12s}
.field input:focus,.field textarea:focus{border-color:var(--accent)}
.field textarea{resize:vertical;min-height:80px;line-height:1.5}

/* ═══ SEARCH ═══ */
.search-box{position:relative;margin-bottom:12px}
.search-box input{width:100%;padding:7px 10px 7px 30px;border:1px solid var(--border);border-radius:var(--r);background:var(--surface);font-size:0.85rem}
.search-box::before{content:'⌕';position:absolute;left:9px;top:50%;transform:translateY(-50%);color:var(--ink-dim);font-size:0.9rem}

/* ═══ MODAL ═══ */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.25);z-index:100;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .15s}
.modal-overlay.open{opacity:1;pointer-events:auto}
.modal{background:var(--surface-2);border:1px solid var(--border);border-radius:calc(var(--r)*2);padding:24px;width:90%;max-width:520px;max-height:85vh;overflow-y:auto;box-shadow:var(--shadow-lg)}
.modal h3{font-size:1.05rem;margin-bottom:16px;color:var(--ink);font-weight:600}
.modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:18px}
.storage-mode-list{display:grid;gap:10px;margin-top:10px}
.storage-mode-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:12px;box-shadow:var(--shadow)}
.storage-mode-card.active{border-color:var(--accent);background:var(--surface-2)}
.storage-mode-card.disabled{opacity:.72}
.storage-mode-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:5px}
.storage-mode-title{font-weight:600;color:var(--ink)}
.storage-mode-badge{font-size:.72rem;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-dim);border:1px solid var(--border);border-radius:999px;padding:2px 7px;background:var(--surface-2)}

/* ═══ BRAINSTORM ═══ */
.brainstorm-toolbar{display:flex;gap:8px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--border);background:var(--surface-2);flex-wrap:wrap}
.brainstorm-board{position:relative;flex:1;overflow:auto;background:var(--bg);background-image:
  radial-gradient(circle, var(--border) 0.5px, transparent 0.5px);
  background-size:28px 28px;
  min-height:400px;
}
.brainstorm-card{position:absolute;width:152px;min-height:76px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:9px 11px;font-size:0.78rem;line-height:1.35;cursor:pointer;transition:border-color .15s, box-shadow .15s, background .15s;overflow:hidden;display:flex;flex-direction:column;box-shadow:var(--shadow)}
.brainstorm-card:hover{border-color:var(--border-strong);box-shadow:var(--shadow-lg)}
.brainstorm-card.active{border-color:var(--accent);background:var(--accent-soft);box-shadow:0 0 0 3px var(--accent-soft),var(--shadow-lg);z-index:10}
.brainstorm-card.neighbor{border-color:var(--neighbor-border);background:var(--neighbor-bg);box-shadow:0 0 0 2px rgba(111,158,110,0.18);z-index:5}
.brainstorm-card .sid{font-family:var(--mono);font-size:0.65rem;color:var(--ink-dim)}
.brainstorm-card .text{margin-top:3px;color:var(--ink)}

.connection-item{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:12px;margin-bottom:10px;box-shadow:var(--shadow);transition:all .12s}
.connection-item.interesting{border-color:var(--accent);border-left:3px solid var(--accent);background:var(--surface-2)}
.connection-header{display:flex;align-items:center;gap:6px;margin-bottom:6px}
.connection-direction{font-size:0.7rem;color:var(--ink-dim);text-transform:uppercase;letter-spacing:0.04em;font-weight:500}
.connection-text{font-size:0.85rem;color:var(--ink);line-height:1.4}
.connection-note{font-size:0.8rem;color:var(--ink-light);font-style:italic;margin-top:6px;padding-top:6px;border-top:1px solid var(--border)}

.focus-card-box{background:var(--accent-soft);border:1px solid var(--accent);border-radius:var(--r);padding:12px;margin-bottom:16px}
.focus-card-box .sid{font-family:var(--mono);font-size:0.72rem;color:var(--ink-dim)}
.focus-card-box .text{font-size:0.92rem;margin-top:4px;line-height:1.45}

/* kept for card-mode relations list */
.relation-item{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:10px;margin-bottom:8px;box-shadow:var(--shadow)}
.relation-item.interesting{border-color:var(--accent);background:var(--surface-2)}
.relation-pair{font-size:0.82rem;margin-bottom:4px}
.relation-pair .sid{font-family:var(--mono);font-size:0.72rem;color:var(--ink-dim)}
.relation-note{font-size:0.8rem;color:var(--ink-light);font-style:italic;margin-top:4px}

/* ═══ COMPOSITION ═══ */
.comp-item{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:10px 12px;margin-bottom:8px;cursor:pointer;transition:all .12s;box-shadow:var(--shadow)}
.comp-item:hover{border-color:var(--border-strong)}
.comp-item.selected{border-color:var(--accent);background:var(--surface-2)}
.comp-card{display:flex;align-items:flex-start;gap:8px;padding:8px 10px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r);margin-bottom:6px}
.comp-card .handle{cursor:grab;color:var(--ink-dim);user-select:none;font-size:1.1rem;line-height:1}
.comp-card .text{flex:1;font-size:0.88rem}
.comp-card .sid{font-family:var(--mono);font-size:0.7rem;color:var(--ink-dim);white-space:nowrap}

.preview-box{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:16px;line-height:1.8;font-size:0.95rem;white-space:pre-wrap;min-height:120px;font-family:var(--serif)}

/* ═══ EMPTY STATES ═══ */
.empty{text-align:center;padding:40px 20px;color:var(--ink-dim);font-size:0.9rem;line-height:1.6}
.empty .icon{font-size:2rem;margin-bottom:8px;opacity:0.4}

/* ═══ SPLIT PREVIEW ═══ */
.split-preview-item{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:8px 12px;margin-bottom:6px;font-size:0.88rem}
.split-preview-item .num{font-family:var(--mono);font-size:0.72rem;color:var(--ink-dim);margin-right:6px}

/* ═══ STATUS ═══ */
.status-dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:5px}
.status-dot.draft{background:var(--ink-dim)}
.status-dot.active{background:var(--green)}
.status-dot.archived{background:var(--red)}

/* ═══ TOAST ═══ */
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--ink);color:var(--surface);padding:10px 20px;border-radius:var(--r);font-size:0.85rem;z-index:200;opacity:0;transition:all .25s}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ═══ RESPONSIVE ═══ */
@media(max-width:900px){
  .main{flex-direction:column;height:auto}
  .panel-left,.panel-right{width:100%;border:none;border-bottom:1px solid var(--border)}
  .panel-right{border-bottom:none;border-top:1px solid var(--border)}
  .brainstorm-board{min-height:350px}
  .brainstorm-card{width:120px;min-height:60px;font-size:0.72rem}
}
</style>
</head>
<body>

<header class="app-header">
  <div class="app-title">Rilke <span>Gedichtezettelkasten</span></div>
  <button class="btn" onclick="exportCardsAsMarkdown()">📄 Export Markdown</button>
  <button class="btn" onclick="openSettingsModal()">⚙ Speicher</button>
  <nav class="tab-bar">
    <button class="tab-btn active" onclick="switchTab('cards')">Karten</button>
    <button class="tab-btn" onclick="switchTab('brainstorm')">Brainstorm</button>
    <button class="tab-btn" onclick="switchTab('composition')">Komposition</button>
  </nav>
</header>

<!-- ═══ KARTEN-MODUS ═══ -->
<div class="main" id="view-cards">
  <div class="panel panel-left" id="cards-list-panel">
    <div class="search-box"><input type="text" placeholder="Karten durchsuchen…" oninput="UI.searchQuery=this.value;renderCardsList()"></div>
    <button class="btn btn-accent" style="width:100%;margin-bottom:12px" onclick="openNewCardModal()">+ Neue Karte</button>
    <div id="cards-tree"></div>
  </div>
  <div class="panel panel-center" id="cards-detail">
    <div class="empty" id="cards-empty"><div class="icon">✎</div>Wähle eine Karte oder erstelle eine neue.</div>
    <div id="card-detail-content" style="display:none"></div>
  </div>
  <div class="panel panel-right" id="cards-actions">
    <div id="card-actions-content"></div>
  </div>
</div>

<!-- ═══ BRAINSTORM-MODUS ═══ -->
<div class="main" id="view-brainstorm" style="display:none;flex-direction:column">
  <div class="brainstorm-toolbar">
    <button class="btn" onclick="shuffleBrainstorm()">⟳ Neu mischen</button>
    <label style="font-size:0.8rem;color:var(--ink-light)">Spalten:
      <select id="bs-cols" onchange="setBrainstormCols(this.value)" style="padding:3px 6px;border:1px solid var(--border);border-radius:var(--r);background:var(--surface);font-size:0.8rem">
        <option value="3">3</option><option value="4">4</option><option value="5" selected>5</option><option value="6">6</option><option value="7">7</option>
      </select>
    </label>
    <label style="font-size:0.8rem;color:var(--ink-light)">Zeilen:
      <select id="bs-rows" onchange="setBrainstormRows(this.value)" style="padding:3px 6px;border:1px solid var(--border);border-radius:var(--r);background:var(--surface);font-size:0.8rem">
        <option value="3">3</option><option value="4" selected>4</option><option value="5">5</option><option value="6">6</option>
      </select>
    </label>
    <button class="btn btn-sm" onclick="clearBrainstormFocus()" id="bs-clear-focus" style="display:none">✕ Fokus lösen</button>
    <span style="margin-left:auto;font-size:0.78rem;color:var(--ink-dim)" id="bs-info"></span>
  </div>
  <div style="display:flex;flex:1;min-height:0;overflow:hidden">
    <div class="brainstorm-board" id="bs-board"></div>
    <div class="panel panel-right" style="overflow-y:auto">
      <div class="detail-label">Verbindungen</div>
      <div id="bs-connections"></div>
    </div>
  </div>
</div>

<!-- ═══ KOMPOSITIONS-MODUS ═══ -->
<div class="main" id="view-composition" style="display:none">
  <div class="panel panel-left">
    <button class="btn btn-accent" style="width:100%;margin-bottom:12px" onclick="openNewCompModal()">+ Neue Komposition</button>
    <div id="comp-list"></div>
    <hr style="border:none;border-top:1px solid var(--border);margin:16px 0">
    <div class="detail-label">Karten hinzufügen</div>
    <div class="search-box"><input type="text" placeholder="Karte suchen…" id="comp-card-search" oninput="renderCompCardPicker()"></div>
    <div id="comp-card-picker"></div>
  </div>
  <div class="panel panel-center">
    <div id="comp-detail"></div>
  </div>
  <div class="panel panel-right">
    <div class="detail-label">Vorschau</div>
    <div class="preview-box" id="comp-preview"></div>
    <div class="btn-group" style="margin-top:12px">
      <button class="btn" onclick="copyCompText()">📋 Kopieren</button>
      <button class="btn" onclick="copyCompTextWithIds()">📋 Mit IDs</button>
    </div>
  </div>
</div>

<!-- ═══ MODAL ═══ -->
<div class="modal-overlay" id="modal-overlay" onclick="if(event.target===this)closeModal()">
  <div class="modal" id="modal-body"></div>
</div>

<!-- ═══ TOAST ═══ -->
<div class="toast" id="toast"></div>

<script>
/* ═══════════════════════════════════════════
   RILKE — Gedichtezettelkasten
   Single-File HTML App · v1.1
   ═══════════════════════════════════════════ */

// ─── Storage Keys ───
var LKEY = 'poem_zettelkasten_v1';
var LEGACY_MIGRATION_MARKER_KEY = 'rilke_idb_legacy_migration_v1';
var DB_NAME = 'rilke_db_v1';
var DB_VERSION = 1;
var DB_STORE_NAME = 'state';
var DB_STATE_KEY = 'appState';
var DEVICE_ID_KEY = 'rilke_device_id';
var DEVICE_NAME_KEY = 'rilke_device_name';
var LAST_SYNC_FINGERPRINT_KEY = 'rilke_last_sync_fingerprint';
var GIST_TOKEN_KEY = 'rilke_gist_token';
var GIST_ID_KEY = 'rilke_gist_id';
var SYNC_PASSPHRASE_KEY = 'rilke_sync_passphrase';
var SYNC_PASSPHRASE_REMEMBER_KEY = 'rilke_sync_passphrase_remember';
var GIST_FILE = 'rilke-encrypted-v1.json';
var SYNC_ENVELOPE_FORMAT = 'rilke-encrypted-v1';
var SYNC_PAYLOAD_FORMAT = 'rilke-sync-v1';
var SYNC_VERSION = 1;
var PBKDF2_ITERATIONS = 250000;

// ─── State ───
function createDefaultState() {
  return {
    cards: [],
    pairRelations: [],
    compositions: [],
    matrixSessions: [],
    deletedIds: {},
    config: {
      appName: 'Rilke',
      matrixCols: 5,
      matrixRows: 4,
      exportMode: 'plain',
      storageMode: 'local'
    },
    _lastExported: ''
  };
}

var S = createDefaultState();

var UI = {
  tab: 'cards',
  selectedCardUid: '',
  selectedRelationUid: '',
  selectedCompositionUid: '',
  searchQuery: '',
  showArchived: false
};

// ─── Brainstorm state (not persisted) ───
var brainstormOrder = [];
var brainstormActiveUid = '';
var brainstormJitters = {};

// ─── Helpers ───
function uid() { return Date.now().toString() + Math.random().toString(36).slice(2,8); }
function now() { return new Date().toISOString(); }
function esc(s) { if (!s) return ''; var d = document.createElement('div'); d.textContent = s; return d.innerHTML; }
function truncate(s, n) { return s && s.length > n ? s.slice(0, n) + '…' : (s || ''); }
function $(id) { return document.getElementById(id); }

// ─── Persistence ───
var _db = null;
var _dbOpenPromise = null;
var _writeQueue = Promise.resolve();
var _syncInProgress = false;
var _deviceIdSessionFallback = '';
var _persistenceReady = false;
var _storageBackend = 'starting';
var _legacyMigratedThisSession = false;
var _legacyConflictDetected = false;
var _legacyConflictSnapshots = [];
var _startupLegacyWrites = [];
var _committedStateSnapshot = null;
var _activeStateTimestamp = null;
var _lastStorageError = null;
var _storageReadOnly = false;
var _storageWriteError = false;
var _lastSaveErrorToastAt = 0;
var _syncPassphraseSession = '';

function isPlausibleRilkeState(value) {
  return !!(value && typeof value === 'object' && Array.isArray(value.cards));
}

function cloneState(value) {
  return JSON.parse(JSON.stringify(value));
}

function getStateTimestamp(state) {
  if (!state || typeof state._lastExported !== 'string') return null;
  var value = Date.parse(state._lastExported);
  return isNaN(value) ? null : value;
}

function normalizedStateCloneForComparison(state) {
  var copy = cloneState(state || {});
  normalizeStateObject(copy, { silent: true });
  return copy;
}

function stateComparableSnapshot(state) {
  var snapshot = normalizedStateCloneForComparison(state || {});
  delete snapshot._lastExported;
  return snapshot;
}

function stableStringify(value) {
  if (Array.isArray(value)) {
    return '[' + value.map(function(item){ return stableStringify(item); }).join(',') + ']';
  }
  if (value && typeof value === 'object') {
    return '{' + Object.keys(value).sort().map(function(key){
      return JSON.stringify(key) + ':' + stableStringify(value[key]);
    }).join(',') + '}';
  }
  return JSON.stringify(value);
}

function getComparableStateString(state) {
  return stableStringify(stateComparableSnapshot(state));
}

function fingerprintComparableState(state) {
  var value = getComparableStateString(state);
  var hash = 2166136261;
  for (var i = 0; i < value.length; i++) {
    hash ^= value.charCodeAt(i);
    hash = Math.imul(hash, 16777619);
  }
  return value.length + ':' + (hash >>> 0).toString(16);
}

function areStatesEquivalent(a, b) {
  try {
    return getComparableStateString(a) === getComparableStateString(b);
  } catch(e) {
    console.warn('State-Vergleich fehlgeschlagen', e);
    return false;
  }
}

function getDeviceId() {
  try {
    if (typeof localStorage !== 'undefined') {
      var existing = String(localStorage.getItem(DEVICE_ID_KEY) || '').trim();
      if (existing) {
        _deviceIdSessionFallback = existing;
        return existing;
      }
      if (!_deviceIdSessionFallback) _deviceIdSessionFallback = uid();
      localStorage.setItem(DEVICE_ID_KEY, _deviceIdSessionFallback);
      return _deviceIdSessionFallback;
    }
  } catch(e) {
    console.warn('Device-ID konnte nicht aus localStorage gelesen oder geschrieben werden', e);
  }
  if (!_deviceIdSessionFallback) _deviceIdSessionFallback = uid();
  return _deviceIdSessionFallback;
}

function getDeviceName() {
  try {
    if (typeof localStorage !== 'undefined') {
      var existing = String(localStorage.getItem(DEVICE_NAME_KEY) || '').trim();
      if (existing) return existing;
    }
  } catch(e) {
    console.warn('Device-Name konnte nicht aus localStorage gelesen werden', e);
  }
  return 'Gerät';
}

function rememberSyncFingerprintValue(fingerprint) {
  if (typeof fingerprint !== 'string' || !fingerprint.trim()) throw new Error('Sync-Baseline konnte nicht gespeichert werden: ungültiger Fingerprint.');
  if (typeof localStorage === 'undefined') throw new Error('Sync-Baseline konnte nicht gespeichert werden: localStorage fehlt.');
  var value = fingerprint.trim();
  try { localStorage.setItem(LAST_SYNC_FINGERPRINT_KEY, value); }
  catch(e) { throw new Error('Sync-Baseline konnte nicht gespeichert werden: ' + (e && e.message ? e.message : String(e))); }
  return value;
}

function rememberSyncFingerprint(state) {
  var fingerprint = fingerprintComparableState(state || S);
  return rememberSyncFingerprintValue(fingerprint);
}

function readSyncFingerprint() {
  try {
    if (typeof localStorage === 'undefined') return '';
    return String(localStorage.getItem(LAST_SYNC_FINGERPRINT_KEY) || '');
  } catch(e) {
    console.warn('Sync-Fingerprint konnte nicht gelesen werden', e);
    return '';
  }
}

function readLegacyMigrationMarker() {
  try {
    if (typeof localStorage === 'undefined') return null;
    var raw = localStorage.getItem(LEGACY_MIGRATION_MARKER_KEY);
    if (!raw) return null;
    var marker = JSON.parse(raw);
    if (!marker || marker.schemaVersion !== 'rilke-legacy-migration-v1' || typeof marker.legacyFingerprint !== 'string') return null;
    return marker;
  } catch(e) {
    console.warn('Legacy-Migrationsmarker konnte nicht gelesen werden', e);
    return null;
  }
}

function writeLegacyMigrationMarker(legacyState) {
  try {
    var marker = {
      schemaVersion: 'rilke-legacy-migration-v1',
      legacyFingerprint: fingerprintComparableState(legacyState),
      migratedAt: now()
    };
    localStorage.setItem(LEGACY_MIGRATION_MARKER_KEY, JSON.stringify(marker));
    return true;
  } catch(e) {
    console.warn('Legacy-Migrationsmarker konnte nicht geschrieben werden', e);
    return false;
  }
}

function isKnownMigratedLegacyBaseline(legacyState, marker) {
  marker = marker || readLegacyMigrationMarker();
  return !!(marker && marker.legacyFingerprint === fingerprintComparableState(legacyState));
}

function compareLegacyFreshness(idbState, legacyState, marker) {
  if (!isPlausibleRilkeState(legacyState)) return 'no-legacy';
  var idbTs = getStateTimestamp(idbState);
  var legacyTs = getStateTimestamp(legacyState);
  if (areStatesEquivalent(idbState, legacyState)) return 'same';
  var markerMatchesLegacy = isKnownMigratedLegacyBaseline(legacyState, marker);
  if (markerMatchesLegacy && (legacyTs === null || (idbTs !== null && legacyTs !== null && idbTs >= legacyTs))) return 'idb-newer';
  if (idbTs !== null && legacyTs !== null && legacyTs < idbTs) return 'idb-newer';
  return 'conflict';
}

function captureLegacyConflictSnapshot(legacyState, source) {
  if (!isPlausibleRilkeState(legacyState)) return null;
  var copy = cloneState(legacyState);
  var fingerprint = fingerprintComparableState(copy);
  for (var i = 0; i < _legacyConflictSnapshots.length; i++) {
    if (_legacyConflictSnapshots[i].fingerprint === fingerprint) return _legacyConflictSnapshots[i];
  }
  var entry = {
    state: copy,
    source: source || 'unknown',
    capturedAt: now(),
    legacyTimestamp: getStateTimestamp(copy),
    fingerprint: fingerprint
  };
  _legacyConflictSnapshots.push(entry);
  while (_legacyConflictSnapshots.length > 5) _legacyConflictSnapshots.shift();
  return entry;
}


function queueStartupLegacyWrite(rawValue) {
  var parsed;
  try {
    parsed = JSON.parse(rawValue);
  } catch(e) {
    console.warn('Legacy-storage-Event während des Starts konnte nicht geparst werden', e);
    return null;
  }
  if (!isPlausibleRilkeState(parsed)) return null;
  var copy = cloneState(parsed);
  var fingerprint = fingerprintComparableState(copy);
  for (var i = 0; i < _startupLegacyWrites.length; i++) {
    if (_startupLegacyWrites[i].fingerprint === fingerprint) return _startupLegacyWrites[i];
  }
  var entry = {
    state: copy,
    source: 'startup-storage-event',
    capturedAt: now(),
    legacyTimestamp: getStateTimestamp(copy),
    fingerprint: fingerprint
  };
  _startupLegacyWrites.push(entry);
  while (_startupLegacyWrites.length > 5) _startupLegacyWrites.shift();
  return entry;
}

function recordCommittedState(stateSnapshot) {
  _committedStateSnapshot = cloneState(stateSnapshot);
  _activeStateTimestamp = getStateTimestamp(stateSnapshot);
}

function handleRuntimeLegacyStorageValue(rawValue) {
  var legacyState;
  try {
    legacyState = JSON.parse(rawValue);
  } catch(e) {
    console.warn('Legacy-storage-Event konnte nicht geparst werden', e);
    return;
  }
  if (!isPlausibleRilkeState(legacyState)) return;
  var activeBaseline = _committedStateSnapshot || S;
  var freshness = compareLegacyFreshness(activeBaseline, legacyState, readLegacyMigrationMarker());
  if (freshness === 'no-legacy' || freshness === 'same' || freshness === 'idb-newer') return;
  var legacyTs = getStateTimestamp(legacyState);
  var activeTs = getStateTimestamp(activeBaseline);
  captureLegacyConflictSnapshot(legacyState, 'storage-event');
  if (activeTs === null || legacyTs === null) {
    markLegacyConflict('Ein anderer älterer Rilke-Tab hat abweichende localStorage-Daten mit nicht eindeutig vergleichbarem Zeitstempel geschrieben. Bearbeitung wurde gesperrt.');
  } else if (legacyTs === activeTs) {
    markLegacyConflict('Ein anderer älterer Rilke-Tab hat abweichende localStorage-Daten mit gleichem Zeitstempel geschrieben. Bearbeitung wurde gesperrt.');
  } else {
    markLegacyConflict('Ein anderer älterer Rilke-Tab hat neuere localStorage-Daten geschrieben. Bearbeitung wurde gesperrt.');
  }
  toast('Speicherkonflikt: Andere Rilke-Tabs schließen und neu laden.');
}

function collectStartupLegacyCandidates(options) {
  options = options || {};
  var candidates = [];
  var seen = {};
  var finalReadError = null;

  function addCandidate(state, source) {
    if (!isPlausibleRilkeState(state)) return;
    var copy = cloneState(state);
    var fingerprint = fingerprintComparableState(copy);
    if (seen[fingerprint]) return;
    seen[fingerprint] = true;
    candidates.push({
      state: copy,
      source: source,
      fingerprint: fingerprint
    });
  }

  for (var i = 0; i < _startupLegacyWrites.length; i++) {
    addCandidate(_startupLegacyWrites[i].state, _startupLegacyWrites[i].source || 'startup-storage-event');
  }

  if (options.includeCurrentLegacy) {
    try {
      var raw = localStorage.getItem(LKEY);
      if (raw) {
        try {
          addCandidate(JSON.parse(raw), 'startup-final-localStorage');
        } catch(e) {
          console.warn('Finaler Legacy-localStorage-State konnte nicht geparst werden; kein plausibler Startup-Kandidat.', e);
        }
      }
    } catch(e) {
      finalReadError = e;
    }
  }

  return {
    candidates: candidates,
    finalReadError: finalReadError
  };
}

function drainStartupLegacyWritesToRecovery(activeState, options) {
  options = options || {};
  var collected = collectStartupLegacyCandidates({ includeCurrentLegacy: options.includeCurrentLegacy !== false });
  var marker = readLegacyMigrationMarker();
  var hasConflict = false;
  for (var i = 0; i < collected.candidates.length; i++) {
    var candidate = collected.candidates[i];
    var freshness = compareLegacyFreshness(activeState, candidate.state, marker);
    if (freshness === 'conflict') {
      captureLegacyConflictSnapshot(candidate.state, candidate.source);
      hasConflict = true;
    }
  }
  _startupLegacyWrites = [];
  if (collected.finalReadError) {
    handleStorageError('Finaler Legacy-localStorage-State konnte nicht gelesen werden. Schreibbarer Start wurde verhindert.', collected.finalReadError);
  }
  return {
    hasConflict: hasConflict,
    finalReadError: collected.finalReadError
  };
}

function finalizeStartupLegacySafety(activeState) {
  var result = drainStartupLegacyWritesToRecovery(activeState, {
    includeCurrentLegacy: true,
    conservative: true
  });
  if (result.hasConflict) {
    recordCommittedState(activeState);
    markLegacyConflict('Während des Starts wurden abweichende Legacy-localStorage-Daten erkannt. Der aktive IndexedDB-State wurde nicht überschrieben; Bearbeitung wurde gesperrt.');
    return false;
  }
  if (result.finalReadError) {
    recordCommittedState(activeState);
    _storageBackend = 'legacy-conflict';
    _storageReadOnly = true;
    _storageWriteError = true;
    _legacyConflictDetected = true;
    _persistenceReady = true;
    return false;
  }
  return true;
}

function enterStartupLegacyConflictWithBaseline(baseline, message) {
  S = cloneState(baseline);
  normalizeLoadedState();
  recordCommittedState(baseline);
  markLegacyConflict(message);
}

function checkStartupLegacySafetyAgainstBaseline(baseline, message) {
  var result = drainStartupLegacyWritesToRecovery(baseline, {
    includeCurrentLegacy: true,
    conservative: true
  });
  if (result.hasConflict) {
    enterStartupLegacyConflictWithBaseline(baseline, message);
    return false;
  }
  if (result.finalReadError) {
    S = cloneState(baseline);
    normalizeLoadedState();
    recordCommittedState(baseline);
    _storageBackend = 'legacy-conflict';
    _storageReadOnly = true;
    _storageWriteError = true;
    _legacyConflictDetected = true;
    _persistenceReady = true;
    return false;
  }
  return true;
}

async function rollbackMaintenanceWriteAndEnterLegacyConflict(committedSnapshot, message) {
  try {
    await enqueueStateWrite(cloneState(committedSnapshot));
  } catch(e) {
    handleStorageError('Maintenance-Rollback nach Startup-Legacy-Konflikt fehlgeschlagen. Unveränderter IndexedDB-Snapshot bleibt im Recovery-Arbeitsspeicher erhalten.', e);
  }
  var finalDrain = drainStartupLegacyWritesToRecovery(committedSnapshot, {
    includeCurrentLegacy: true,
    conservative: true
  });
  if (finalDrain.finalReadError) {
    handleStorageError('Finaler Legacy-localStorage-State konnte nach dem Maintenance-Rollback nicht gelesen werden. Der ursprüngliche IndexedDB-Snapshot bleibt im Recovery-Arbeitsspeicher erhalten.', finalDrain.finalReadError);
  }
  enterStartupLegacyConflictWithBaseline(committedSnapshot, message);
}

async function checkStartupLegacySafetyAfterMaintenanceWrite(committedSnapshot, message) {
  var result = drainStartupLegacyWritesToRecovery(committedSnapshot, {
    includeCurrentLegacy: true,
    conservative: true
  });
  if (result.hasConflict) {
    await rollbackMaintenanceWriteAndEnterLegacyConflict(committedSnapshot, message);
    return false;
  }
  if (result.finalReadError) {
    await rollbackMaintenanceWriteAndEnterLegacyConflict(committedSnapshot, 'Finaler Legacy-localStorage-State konnte nach dem Maintenance-Write nicht gelesen werden. Der ursprüngliche IndexedDB-State wurde als Recovery-Basis wiederhergestellt; Bearbeitung wurde gesperrt.');
    return false;
  }
  return true;
}

function activateIndexedDbMode(state) {
  recordCommittedState(state);
  _storageBackend = 'indexeddb';
  _storageReadOnly = false;
  _storageWriteError = false;
  _legacyConflictDetected = false;
  _lastStorageError = null;
  _persistenceReady = true;
}

function markLegacyConflict(message) {
  _storageBackend = 'legacy-conflict';
  _storageReadOnly = true;
  _storageWriteError = true;
  _legacyConflictDetected = true;
  _persistenceReady = true;
  handleStorageError(message, new Error('Legacy-/IndexedDB-Konflikt'));
}

function openRilkeDb() {
  if (_db) return Promise.resolve(_db);
  if (_dbOpenPromise) return _dbOpenPromise;
  _dbOpenPromise = new Promise(function(resolve, reject) {
    if (!window.indexedDB) {
      reject(new Error('IndexedDB ist in diesem Browser nicht verfügbar'));
      return;
    }
    var req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = function(event) {
      var db = event.target.result;
      if (!db.objectStoreNames.contains(DB_STORE_NAME)) {
        db.createObjectStore(DB_STORE_NAME);
      }
    };
    req.onsuccess = function(event) {
      _db = event.target.result;
      _db.onversionchange = function() {
        console.warn('Rilke IndexedDB versionchange: Datenbankverbindung wird geschlossen. Bitte andere Rilke-Tabs neu laden.');
        _db.close();
        _db = null;
        _dbOpenPromise = null;
      };
      resolve(_db);
    };
    req.onerror = function(event) {
      console.error('Rilke IndexedDB konnte nicht geöffnet werden', event.target.error);
      reject(event.target.error || new Error('IndexedDB open failed'));
    };
    req.onblocked = function() {
      console.warn('Rilke IndexedDB Upgrade blockiert. Bitte ggf. einen anderen geöffneten Rilke-Tab schließen.');
    };
  }).catch(function(err) {
    _dbOpenPromise = null;
    throw err;
  });
  return _dbOpenPromise;
}

function idbGetState() {
  return openRilkeDb().then(function(db) {
    return new Promise(function(resolve, reject) {
      var tx;
      try { tx = db.transaction(DB_STORE_NAME, 'readonly'); }
      catch (e) { reject(e); return; }
      var store = tx.objectStore(DB_STORE_NAME);
      var result;
      var req = store.get(DB_STATE_KEY);
      req.onsuccess = function() { result = req.result; };
      tx.oncomplete = function() { resolve(result); };
      req.onerror = function(event) {
        console.error('Rilke IndexedDB State konnte nicht gelesen werden', event.target.error);
        reject(event.target.error || new Error('IndexedDB read failed'));
      };
      tx.onerror = function(event) {
        reject(event.target.error || tx.error || new Error('IndexedDB read transaction failed'));
      };
      tx.onabort = function() {
        reject(tx.error || new Error('IndexedDB read transaction aborted'));
      };
    });
  });
}

function idbSetState(stateSnapshot) {
  return openRilkeDb().then(function(db) {
    return new Promise(function(resolve, reject) {
      var tx;
      try { tx = db.transaction(DB_STORE_NAME, 'readwrite'); }
      catch (e) { reject(e); return; }
      tx.oncomplete = function() { resolve(); };
      tx.onerror = function(event) {
        console.error('Rilke IndexedDB State konnte nicht geschrieben werden', event.target.error || tx.error);
        reject(event.target.error || tx.error || new Error('IndexedDB write failed'));
      };
      tx.onabort = function() {
        console.error('Rilke IndexedDB Schreibtransaktion abgebrochen', tx.error);
        reject(tx.error || new Error('IndexedDB write transaction aborted'));
      };
      tx.objectStore(DB_STORE_NAME).put(stateSnapshot, DB_STATE_KEY);
    });
  });
}

function enqueueStateWrite(stateSnapshot) {
  var op = _writeQueue.catch(function(){ /* keep queue alive after failed write */ }).then(function() {
    return idbSetState(stateSnapshot);
  });
  _writeQueue = op.catch(function(){ /* next write may still run */ });
  return op;
}

function handleStorageError(context, err) {
  _lastStorageError = context + ': ' + (err && err.message ? err.message : String(err));
  console.error(context, err);
}

function notifySaveError(err) {
  _storageWriteError = true;
  handleStorageError('Rilke Speicherfehler: Änderungen wurden nicht dauerhaft gespeichert. Bitte ZIP-Backup als Recovery nutzen.', err);
  var t = Date.now();
  if (t - _lastSaveErrorToastAt > 6000) {
    _lastSaveErrorToastAt = t;
    toast('Speicherfehler: Änderungen nicht dauerhaft gespeichert. ZIP-Backup empfohlen.');
  }
}

function isStateWritable() {
  return _persistenceReady && !_storageReadOnly && !_storageWriteError && _storageBackend === 'indexeddb';
}

function ensureStateWritable() {
  if (_syncInProgress) { toast('Sync läuft – Änderungen sind kurzzeitig gesperrt.'); return false; }
  if (isStateWritable()) return true;
  toast('Nur-Lese-Modus: Bitte ZIP-Backup exportieren und das Speicherproblem beheben.');
  return false;
}

function normalizeStateObject(state, options) {
  options = options || {};
  var T = state || {};
  var changed = false;
  if (!Array.isArray(T.cards)) { T.cards = []; changed = true; }
  var sidMigrationCount = 0;
  for (var i = 0; i < T.cards.length; i++) {
    var card = T.cards[i];
    if (!card || card.sid === null || card.sid === undefined) continue;
    var rawSid = String(card.sid).trim();
    if (!rawSid) continue;
    var hasDot = rawSid.indexOf('.') !== -1;
    var hasDigit = /\d/.test(rawSid);
    var hasLetter = /[a-zA-Z]/.test(rawSid);
    if (hasDot || !hasDigit || !hasLetter) continue;
    var migratedSid = normalizeSid(rawSid);
    if (!migratedSid) continue;
    if (migratedSid !== rawSid) {
      card.sid = migratedSid;
      sidMigrationCount++;
      changed = true;
    }
  }
  if (!Array.isArray(T.pairRelations)) { T.pairRelations = []; changed = true; }
  if (!Array.isArray(T.compositions)) { T.compositions = []; changed = true; }
  if (!Array.isArray(T.matrixSessions)) { T.matrixSessions = []; changed = true; }
  if (!T.deletedIds || typeof T.deletedIds !== 'object' || Array.isArray(T.deletedIds)) { T.deletedIds = {}; changed = true; }
  if (!T.config || typeof T.config !== 'object') { T.config = {}; changed = true; }
  if (!T.config.appName) { T.config.appName = 'Rilke'; changed = true; }
  if (!T.config.matrixCols) { T.config.matrixCols = 5; changed = true; }
  if (!T.config.matrixRows) { T.config.matrixRows = 4; changed = true; }
  if (!T.config.exportMode) { T.config.exportMode = 'plain'; changed = true; }
  if (T.config.storageMode !== 'local') { T.config.storageMode = 'local'; changed = true; }
  if (typeof T._lastExported !== 'string') { T._lastExported = ''; changed = true; }
  if (sidMigrationCount > 0 && !options.silent) console.log('SID migration applied to ' + sidMigrationCount + ' cards');
  return changed;
}

function normalizeLoadedState() {
  return normalizeStateObject(S);
}

function pruneDeletedIds() {
  var changed = normalizeStateObject(S, { silent: true });
  var cutoff = Date.now() - 90 * 24 * 60 * 60 * 1000;
  var kept = {};
  var invalidCount = 0;
  Object.keys(S.deletedIds).forEach(function(id) {
    var raw = S.deletedIds[id];
    var parsed = (typeof raw === 'string' && raw.trim()) ? Date.parse(raw) : NaN;
    if (isNaN(parsed)) {
      kept[id] = raw;
      invalidCount++;
      return;
    }
    if (parsed < cutoff) {
      changed = true;
      return;
    }
    kept[id] = raw;
  });
  if (changed) S.deletedIds = kept;
  if (invalidCount > 0) console.warn('Tombstone-Pruning hat ' + invalidCount + ' Tombstone(s) mit ungültigem Zeitpunkt defensiv behalten.');
  return changed;
}

function gcOrphanRelations(targetState) {
  var T = targetState || S;
  var changed = normalizeStateObject(T, { silent: true });
  var cardUids = {};
  T.cards.forEach(function(card) {
    if (card && card.uid) cardUids[card.uid] = true;
  });
  var gcTimestamp = now();
  var removedWithoutUid = 0;
  var kept = [];
  T.pairRelations.forEach(function(rel) {
    var fromUid = rel && rel.fromCardUid;
    var toUid = rel && rel.toCardUid;
    var orphan = !fromUid || !toUid || !!T.deletedIds[fromUid] || !!T.deletedIds[toUid] || !cardUids[fromUid] || !cardUids[toUid];
    if (!orphan) {
      kept.push(rel);
      return;
    }
    changed = true;
    if (rel && rel.uid) {
      if (!T.deletedIds[rel.uid]) T.deletedIds[rel.uid] = gcTimestamp;
    } else {
      removedWithoutUid++;
    }
  });
  if (changed) T.pairRelations = kept;
  if (removedWithoutUid > 0) console.warn('Relation-GC hat ' + removedWithoutUid + ' verwaiste Relation(en) ohne verwendbare UID entfernt.');
  return changed;
}

function runLocalRecoveryMaintenance() {
  var changed = normalizeLoadedState();
  changed = pruneDeletedIds() || changed;
  changed = gcOrphanRelations() || changed;
  return changed;
}

function getLegacyStateIfPlausible() {
  try {
    var d = localStorage.getItem(LKEY);
    if (!d) return null;
    var p = JSON.parse(d);
    return isPlausibleRilkeState(p) ? p : null;
  } catch(e) {
    console.warn('Legacy localStorage-State konnte nicht gelesen oder geparst werden; keine Migration.', e);
    return null;
  }
}

async function load() {
  var idbState;
  try {
    idbState = await idbGetState();
  } catch(e) {
    handleStorageError('Rilke IndexedDB konnte nicht geöffnet oder gelesen werden. Bestehende IndexedDB-Daten wurden nicht überschrieben.', e);
    var fallback = getLegacyStateIfPlausible();
    S = fallback || createDefaultState();
    normalizeLoadedState();
    drainStartupLegacyWritesToRecovery(S, { includeCurrentLegacy: true, conservative: true });
    _storageBackend = 'emergency';
    _storageReadOnly = true;
    _storageWriteError = true;
    _persistenceReady = true;
    return;
  }

  if (idbState !== undefined && idbState !== null) {
    if (!isPlausibleRilkeState(idbState)) {
      handleStorageError('Vorhandener IndexedDB-State ist unplausibel und wurde nicht überschrieben.', new Error('Unplausibler IndexedDB-State'));
      S = createDefaultState();
      normalizeLoadedState();
      drainStartupLegacyWritesToRecovery(S, { includeCurrentLegacy: true, conservative: true });
      _storageBackend = 'idb-error';
      _storageReadOnly = true;
      _storageWriteError = true;
      _persistenceReady = true;
      return;
    }

    var committedIdbSnapshot = cloneState(idbState);
    var rolloutLegacy = getLegacyStateIfPlausible();
    var freshness = compareLegacyFreshness(idbState, rolloutLegacy);
    if (freshness === 'conflict') {
      captureLegacyConflictSnapshot(rolloutLegacy, 'startup');
      S = idbState;
      normalizeLoadedState();
      drainStartupLegacyWritesToRecovery(S, { includeCurrentLegacy: true, conservative: true });
      recordCommittedState(committedIdbSnapshot);
      markLegacyConflict('IndexedDB und Legacy-localStorage enthalten unterschiedliche, zeitlich nicht eindeutig sortierbare Stände. Bestehende IndexedDB-Daten wurden nicht überschrieben.');
      return;
    }

    if (!checkStartupLegacySafetyAgainstBaseline(committedIdbSnapshot, 'Während des Starts wurden vor der lokalen Wartung abweichende Legacy-localStorage-Daten erkannt. Der ursprüngliche IndexedDB-State wurde nicht überschrieben; Bearbeitung wurde gesperrt.')) return;
    var maintenanceCandidate = cloneState(idbState);
    S = maintenanceCandidate;
    var idbMaintenanceChanged = runLocalRecoveryMaintenance();
    if (idbMaintenanceChanged) {
      if (!checkStartupLegacySafetyAgainstBaseline(committedIdbSnapshot, 'Während des Starts wurden vor dem Maintenance-Write abweichende Legacy-localStorage-Daten erkannt. Der ursprüngliche IndexedDB-State wurde nicht überschrieben; Bearbeitung wurde gesperrt.')) return;
      try {
        await enqueueStateWrite(cloneState(S));
      } catch(e) {
        handleStorageError('Normalisierter IndexedDB-State konnte nicht zurückgeschrieben werden. Geladener State bleibt im Arbeitsspeicher.', e);
        drainStartupLegacyWritesToRecovery(committedIdbSnapshot, { includeCurrentLegacy: true, conservative: true });
        recordCommittedState(committedIdbSnapshot);
        _storageBackend = 'idb-write-error';
        _storageReadOnly = true;
        _storageWriteError = true;
        _persistenceReady = true;
        return;
      }
      if (!await checkStartupLegacySafetyAfterMaintenanceWrite(committedIdbSnapshot, 'Während des Maintenance-Writes wurden abweichende Legacy-localStorage-Daten erkannt. Der ursprüngliche IndexedDB-State wurde wiederhergestellt; Bearbeitung wurde gesperrt.')) return;
    }
    if (!finalizeStartupLegacySafety(committedIdbSnapshot)) return;
    activateIndexedDbMode(S);
    return;
  }

  var legacy = getLegacyStateIfPlausible();
  if (legacy) {
    var rawLegacyBaseline = cloneState(legacy);
    if (!checkStartupLegacySafetyAgainstBaseline(rawLegacyBaseline, 'Während der Legacy-Migration wurden abweichende Legacy-localStorage-Daten erkannt. Es wurde kein neuer IndexedDB-State geschrieben; Bearbeitung wurde gesperrt.')) return;
    S = cloneState(legacy);
    runLocalRecoveryMaintenance();

  if (q) {
    var matches = allActiveCards().filter(function(c){
      return (c.text||'').toLowerCase().includes(q) || (c.comment||'').toLowerCase().includes(q) || (c.sid||'').toLowerCase().includes(q);
    });
    container.innerHTML = matches.length === 0 ? '<div class="empty" style="padding:20px"><div class="icon">⌕</div>Keine Treffer</div>' : '';
    matches.forEach(function(c){ container.innerHTML += cardItemHtml(c); });
    return;
  }
  container.innerHTML = roots.length === 0 ? '<div class="empty" style="padding:20px"><div class="icon">✎</div>Noch keine Karten</div>' : '';
  roots.forEach(function(c){ container.innerHTML += renderCardTree(c, 0); });
}

function renderCardTree(card, depth) {
  var html = cardItemHtml(card);
  var children = childrenOf(card.uid);
  if (children.length > 0) {
    html += '<div class="child-indent">';
    children.forEach(function(ch){ html += renderCardTree(ch, depth+1); });
    html += '</div>';
  }
  return html;
}

/* ═══════════════════════════════════════════
   BRAINSTORM-MODUS
   ═══════════════════════════════════════════ */

function generateJitter() {
  return {
    dx: Math.round((Math.random() - 0.5) * 22),
    dy: Math.round((Math.random() - 0.5) * 18),
    rot: +((Math.random() - 0.5) * 3.2).toFixed(1)
  };
}

function shuffleBrainstorm() {
  var cards = allActiveCards();
  var arr = cards.map(function(c){return c.uid});
  for (var i = arr.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i+1));
    var t = arr[i]; arr[i] = arr[j]; arr[j] = t;
  }
  brainstormOrder = arr;
  brainstormActiveUid = '';
  brainstormJitters = {};
  arr.forEach(function(u) { brainstormJitters[u] = generateJitter(); });
  renderBrainstorm();
}

function renderBrainstorm() {
  var cols = S.config.matrixCols || 5;
  var rows = S.config.matrixRows || 4;
  var total = cols * rows;
  var order = brainstormOrder.slice(0, total);

  $('bs-info').textContent = order.length + ' von ' + allActiveCards().length + ' Karten ausgelegt';
  $('bs-clear-focus').style.display = brainstormActiveUid ? '' : 'none';

  var colSel = $('bs-cols'); var rowSel = $('bs-rows');
  if (colSel) colSel.value = cols;
  if (rowSel) rowSel.value = rows;

  var board = $('bs-board');
  var boardW = board.clientWidth || 800;
  var boardH = board.clientHeight || 500;

  var cardW = 152; var cardH = 84;
  var padX = 24; var padY = 20;

  var slotW = Math.max(cardW + 14, Math.floor((boardW - padX * 2) / cols));
  var slotH = Math.max(cardH + 12, Math.floor((boardH - padY * 2) / rows));

  var neighborIndices = [];
  if (brainstormActiveUid) {
    var activeIdx = order.indexOf(brainstormActiveUid);
    if (activeIdx >= 0) neighborIndices = getTorusNeighbors(activeIdx, cols, rows);
  }

  var neededW = padX * 2 + cols * slotW;
  var neededH = padY * 2 + rows * slotH;

  var html = '';
  order.forEach(function(cardUid, idx) {
    var c = findCard(cardUid); if (!c) return;
    var row = Math.floor(idx / cols);
    var col = idx % cols;
    var baseX = padX + col * slotW + (slotW - cardW) / 2;
    var baseY = padY + row * slotH + (slotH - cardH) / 2;
    var jit = brainstormJitters[cardUid] || {dx:0,dy:0,rot:0};
    var x = baseX + jit.dx;
    var y = baseY + jit.dy;
    var rot = jit.rot;
    var isActive = cardUid === brainstormActiveUid;
    var isNeighbor = neighborIndices.indexOf(idx) >= 0;
    var cls = 'brainstorm-card';
    if (isActive) cls += ' active';
    else if (isNeighbor) cls += ' neighbor';

    html += '<div class="'+cls+'" style="left:'+x+'px;top:'+y+'px;transform:rotate('+rot+'deg)" onclick="brainstormSelectCard(\''+cardUid+'\')">' +
      '<span class="sid">'+esc(c.sid)+'</span>' +
      '<span class="text">'+esc(truncate(c.text,48))+'</span>' +
    '</div>';
  });

  board.innerHTML = html;
  board.style.minWidth = neededW + 'px';
  board.style.minHeight = neededH + 'px';

  renderBrainstormConnections();
}

function getTorusNeighbors(idx, cols, rows) {
  var row = Math.floor(idx / cols);
  var col = idx % cols;
  return [
    ((row - 1 + rows) % rows) * cols + col,     // oben
    row * cols + ((col + 1) % cols),             // rechts
    ((row + 1) % rows) * cols + col,             // unten
    row * cols + ((col - 1 + cols) % cols)       // links
  ];
}

function brainstormSelectCard(cardUid) {
  brainstormActiveUid = cardUid;
  var cols = S.config.matrixCols || 5;
  var rows = S.config.matrixRows || 4;
  var order = brainstormOrder.slice(0, cols * rows);
  var idx = order.indexOf(cardUid);
  if (idx < 0) return;

  if (isStateWritable()) {
    var neighborIndices = getTorusNeighbors(idx, cols, rows);
    var labels = ['oben', 'rechts', 'unten', 'links'];
    neighborIndices.forEach(function(ni, i) {
      if (ni < order.length) createRelation(cardUid, order[ni], labels[i], 'brainstorm');
    });
  }

  renderBrainstorm();
}

function setBrainstormCols(value) {
  if (!ensureStateWritable()) { $('bs-cols').value = S.config.matrixCols || 5; return; }
  S.config.matrixCols = +value;
  saveDebounced();
  renderBrainstorm();
}

function setBrainstormRows(value) {
  if (!ensureStateWritable()) { $('bs-rows').value = S.config.matrixRows || 4; return; }
  S.config.matrixRows = +value;
  saveDebounced();
  renderBrainstorm();
}

function clearBrainstormFocus() { brainstormActiveUid = ''; renderBrainstorm(); }

function renderBrainstormConnections() {
  var el = $('bs-connections');
  if (!brainstormActiveUid) {
    el.innerHTML = '<div class="empty" style="padding:24px"><div class="icon">◇</div>Wähle eine Karte auf dem Board,<br>um Nachbarschaften zu entdecken.</div>';
    return;
  }
  var c = findCard(brainstormActiveUid);
  var rels = relationsForCard(brainstormActiveUid);

  var html = '<div class="focus-card-box">' +
    '<div style="font-size:0.7rem;text-transform:uppercase;letter-spacing:0.05em;color:var(--ink-dim);margin-bottom:4px;font-weight:500">Fokus</div>' +
    '<span class="sid">'+esc((c||{}).sid||'')+'</span>' +
    '<div class="text">'+esc((c||{}).text||'')+'</div>' +
  '</div>';

  if (rels.length === 0) {
    html += '<div style="color:var(--ink-dim);font-size:0.85rem;padding:8px 0">Noch keine Verbindungen.</div>';
  } else {
    var dirLabels = {oben:'↑ oben',rechts:'→ rechts',unten:'↓ unten',links:'← links'};
    html += rels.map(function(r) {
      var to = findCard(r.toCardUid);
      var dirLabel = dirLabels[r.positionType] || r.positionType;
      return '<div class="connection-item'+(r.isInteresting?' interesting':'')+'">' +
        '<div class="connection-header">' +
          '<span class="connection-direction">'+dirLabel+'</span>' +
          '<span style="font-family:var(--mono);font-size:0.7rem;color:var(--ink-dim)">'+(to?esc(to.sid):'?')+'</span>' +
        '</div>' +
        '<div class="connection-text">'+(to?esc(to.text):'-')+'</div>' +
        (r.note ? '<div class="connection-note">'+esc(r.note)+'</div>' : '') +
        '<div class="btn-group" style="margin-top:8px">' +
          '<button class="btn btn-sm'+(r.isInteresting?' btn-accent':'')+'" onclick="toggleInteresting(\''+r.uid+'\')">'+(r.isInteresting?'⭐ interessant':'☆ merken')+'</button>' +
          '<button class="btn btn-sm" onclick="openRelationNoteModal(\''+r.uid+'\')">✎ Notiz</button>' +
          '<button class="btn btn-sm btn-accent" onclick="openNewCardFromRelation(\''+r.uid+'\')">✨ Idee</button>' +
        '</div>' +
      '</div>';
    }).join('');
  }
  el.innerHTML = html;
}

  if (!ensureStateWritable()) return;
  var title = $('m-title').value.trim();
  if (!title) { toast('Titel fehlt'); return; }
  var c = { uid: 'comp_'+uid(), title: title, cardUids: [], createdAt: now(), updatedAt: now() };
  S.compositions.push(c); UI.selectedCompositionUid = c.uid;
  saveDebounced(); closeModal(); renderComposition(); toast('Komposition erstellt');
}

function renderCompDetail() {
  var el = $('comp-detail');
  var comp = findComp(UI.selectedCompositionUid);
  if (!comp) { el.innerHTML = '<div class="empty"><div class="icon">\ud83d\udcdc</div>W\u00e4hle oder erstelle eine Komposition</div>'; return; }
  var cardsHtml = comp.cardUids.map(function(cuid, idx){
    var c = findCard(cuid); if (!c) return '';
    return '<div class="comp-card" data-idx="'+idx+'">' +
      '<span class="handle" title="Ziehen zum Sortieren">\u2807</span>' +
      '<span class="sid">'+esc(c.sid)+'</span>' +
      '<span class="text">'+esc(c.text)+'</span>' +
      '<button class="btn btn-sm" onclick="moveCompCard(\''+comp.uid+'\','+idx+',-1)" title="Hoch"'+(idx===0?' disabled':'')+'>\u2191</button>' +
      '<button class="btn btn-sm" onclick="moveCompCard(\''+comp.uid+'\','+idx+',1)" title="Runter"'+(idx===comp.cardUids.length-1?' disabled':'')+'>\u2193</button>' +
      '<button class="btn btn-sm btn-danger" onclick="removeCompCard(\''+comp.uid+'\','+idx+')" title="Entfernen">\u2715</button>' +
    '</div>';
  }).join('');
  el.innerHTML =
    '<div style="display:flex;align-items:center;gap:10px;margin-bottom:16px">' +
      '<div style="font-size:1.05rem;font-weight:600">'+esc(comp.title)+'</div>' +
      '<button class="btn btn-sm" onclick="openEditCompModal(\''+comp.uid+'\')">\u270f</button>' +
      '<button class="btn btn-sm btn-danger" onclick="confirmDeleteComp(\''+comp.uid+'\')">\u2715</button>' +
    '</div>' +
    (cardsHtml || '<div style="color:var(--ink-dim);font-size:0.85rem;padding:20px 0">Noch keine Karten \u2014 f\u00fcge Karten \u00fcber die linke Spalte hinzu.</div>');
}

function moveCompCard(compUid, idx, dir) {
  if (!ensureStateWritable()) return;
  var comp = findComp(compUid); if (!comp) return;
  var newIdx = idx + dir;
  if (newIdx < 0 || newIdx >= comp.cardUids.length) return;
  var tmp = comp.cardUids[idx]; comp.cardUids[idx] = comp.cardUids[newIdx]; comp.cardUids[newIdx] = tmp;
  comp.updatedAt = now(); saveDebounced(); renderCompDetail(); renderCompPreview();
}

function removeCompCard(compUid, idx) {
  if (!ensureStateWritable()) return;
  var comp = findComp(compUid); if (!comp) return;
  comp.cardUids.splice(idx, 1); comp.updatedAt = now();
  saveDebounced(); renderCompDetail(); renderCompPreview();
}

function addCardToComp(cardUid) {
  if (!ensureStateWritable()) return;
  var comp = findComp(UI.selectedCompositionUid);
  if (!comp) { toast('Erst eine Komposition ausw\u00e4hlen'); return; }
  if (comp.cardUids.indexOf(cardUid) >= 0) { toast('Karte bereits enthalten'); return; }
  comp.cardUids.push(cardUid); comp.updatedAt = now();
  saveDebounced(); renderCompDetail(); renderCompPreview(); toast('Karte hinzugef\u00fcgt');
}

function renderCompCardPicker() {
  var el = $('comp-card-picker');
  var q = ($('comp-card-search') || {}).value || ''; q = q.toLowerCase();
  var cards = allActiveCards();
  if (q) { cards = cards.filter(function(c){ return (c.text||'').toLowerCase().includes(q) || (c.sid||'').toLowerCase().includes(q); }); }
  el.innerHTML = cards.slice(0, 30).map(function(c){
    return '<div class="card-item" style="margin-bottom:4px;cursor:pointer" onclick="addCardToComp(\''+c.uid+'\')"><span class="sid">'+esc(c.sid)+'</span> <span class="text">'+esc(truncate(c.text,40))+'</span></div>';
  }).join('');
}

function renderCompPreview() {
  var el = $('comp-preview');
  var comp = findComp(UI.selectedCompositionUid);
  if (!comp || comp.cardUids.length === 0) { el.textContent = ''; return; }
  el.textContent = comp.cardUids.map(function(cuid){ var c = findCard(cuid); return c ? c.text : ''; }).filter(function(t){return t}).join('\n');
}

function copyCompText() {
  var comp = findComp(UI.selectedCompositionUid); if (!comp) return;
  var lines = comp.cardUids.map(function(cuid){ var c = findCard(cuid); return c ? c.text : ''; }).filter(function(t){return t});
  copyToClipboard(lines.join('\n')); toast('Text kopiert');
}

function copyCompTextWithIds() {
  var comp = findComp(UI.selectedCompositionUid); if (!comp) return;
  var lines = comp.cardUids.map(function(cuid){ var c = findCard(cuid); return c ? '['+c.sid+'] '+c.text : ''; }).filter(function(t){return t});
  copyToClipboard(lines.join('\n')); toast('Text mit IDs kopiert');
}

function copyToClipboard(text) {
  if (navigator.clipboard && navigator.clipboard.writeText) { navigator.clipboard.writeText(text).catch(function(){ fallbackCopy(text); }); }
  else { fallbackCopy(text); }
}
function fallbackCopy(text) {
  var ta = document.createElement('textarea'); ta.value = text; ta.style.cssText = 'position:fixed;left:-999px';
  document.body.appendChild(ta); ta.select();
  try { document.execCommand('copy'); } catch(e) {} document.body.removeChild(ta);
}

/* ═══════════════════════════════════════════
   MARKDOWN EXPORT (OBSIDIAN)
   ═══════════════════════════════════════════ */

function toObsidianMarkdown(card) {
  var tags = Array.isArray(card.tags) ? card.tags : [];
  var frontmatter = [
    '---',
    'uid: ' + (card.uid || ''),
    'sid: ' + (card.sid || ''),
    'status: ' + (card.status || ''),
    'tags: ' + JSON.stringify(tags),
    'createdAt: ' + (card.createdAt || ''),
    'updatedAt: ' + (card.updatedAt || ''),
    '---',
    '',
    card.text || ''
  ];
  if (card.comment) {
    frontmatter.push('', '## Kommentar', card.comment);
  }
  return frontmatter.join('\n');
}

function safeMarkdownFilename(card) {
  var raw = (card && card.sid ? String(card.sid) : 'card_' + (card && card.uid ? card.uid : uid())) + '.md';
  return raw.replace(/[\\/:*?"<>|]/g, '_');
}

function downloadBlob(filename, blob) {
  var link = document.createElement('a');
  var objectUrl = URL.createObjectURL(blob);
  link.href = objectUrl;
  link.download = filename;
  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);
  setTimeout(function(){ URL.revokeObjectURL(objectUrl); }, 1000);
}

function exportCardsAsSingleText(files) {
  var combined = files.map(function(file) {
    return '===== ' + file.filename + ' =====\n' + file.content;
  }).join('\n\n');
  downloadBlob('rilke-cards-export.md.txt', new Blob([combined], { type: 'text/plain;charset=utf-8' }));
  toast(files.length + ' Karten exportiert (Fallback: Einzeldatei)');
}

function copyMarkdownExport(files) {
  var combined = files.map(function(file) {
    return '===== ' + file.filename + ' =====\n' + file.content;
  }).join('\n\n');
  copyToClipboard(combined);
  toast(files.length + ' Karten als Markdown in Zwischenablage kopiert');
}

function ensureJsZipLoaded() {
  return new Promise(function(resolve, reject) {
    if (window.JSZip) { resolve(window.JSZip); return; }
    var script = document.createElement('script');
    script.src = 'https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js';
    script.onload = function() { resolve(window.JSZip); };
    script.onerror = function() { reject(new Error('JSZip CDN konnte nicht geladen werden')); };
    document.head.appendChild(script);
  });
}

function exportCardsAsMarkdown() {
  var cards = allActiveCards();
  if (cards.length === 0) {
    toast('Keine aktiven Karten zum Export');
    console.log('[Markdown Export] 0 Karten exportiert');
    return;
  }

  var files = cards.map(function(card) {
    var filename = safeMarkdownFilename(card);
    var content = toObsidianMarkdown(card);
    console.log('--- FILE: ' + filename + ' ---\n' + content);
    return { filename: filename, content: content };
  });

  ensureJsZipLoaded().then(function(JSZipLib) {
    var zip = new JSZipLib();
    files.forEach(function(file) { zip.file(file.filename, file.content); });
    return zip.generateAsync({ type: 'blob' });
  }).then(function(blob) {
    if (blob.size > 8 * 1024 * 1024) {
      exportCardsAsSingleText(files);
      return;
    }
    downloadBlob('rilke-cards-markdown.zip', blob);
    toast(files.length + ' Karten als Markdown exportiert');
  }).catch(function(err) {
    console.warn('[Markdown Export] ZIP fehlgeschlagen, nutze Fallback:', err);
    try {
      exportCardsAsSingleText(files);
    } catch (downloadErr) {
      console.warn('[Markdown Export] Download-Fallback fehlgeschlagen, kopiere stattdessen:', downloadErr);
      copyMarkdownExport(files);
    }
  });
}

/* ═══════════════════════════════════════════
   ZIP BACKUP EXPORT
   ═══════════════════════════════════════════ */

function todayFilenamePart() {
  return new Date().toISOString().slice(0, 10);
}

function safeBackupFilename(value, fallback) {
  var raw = value === null || value === undefined ? '' : String(value);
  raw = raw.trim() || fallback || 'rilke';
  raw = raw.replace(/[\\/:*?"<>|]/g, '_').replace(/[\u0000-\u001f]/g, '_');
  raw = raw.replace(/\s+/g, '_').replace(/^\.+/, '').slice(0, 120);
  return raw || fallback || 'rilke';
}

function getAllCardsForBackup() {
  return Array.isArray(S.cards) ? S.cards : [];
}

function isCredentialKey(key) {
  return /token|passphrase|password|api[_-]?key|secret|credential|gist/i.test(String(key || ''));
}

function sanitizeBackupValue(value) {
  if (Array.isArray(value)) {
    return value.map(function(item) { return sanitizeBackupValue(item); });
  }
  if (value && typeof value === 'object') {
    var out = {};
    Object.keys(value).forEach(function(key) {
      if (!isCredentialKey(key)) out[key] = sanitizeBackupValue(value[key]);
    });
    return out;
  }
  return value;
}

function buildBackupSnapshotFromState(state) {
  state = state || {};
  return sanitizeBackupValue({
    cards: Array.isArray(state.cards) ? state.cards : [],
    pairRelations: Array.isArray(state.pairRelations) ? state.pairRelations : [],
    compositions: Array.isArray(state.compositions) ? state.compositions : [],
    matrixSessions: Array.isArray(state.matrixSessions) ? state.matrixSessions : [],
    deletedIds: state.deletedIds || {},
    config: state.config || {},
    _lastExported: state._lastExported || ''
  });
}

function buildBackupSnapshot() {
  return buildBackupSnapshotFromState(S);
}

function buildCardByUid(cards) {
  var map = {};
  (Array.isArray(cards) ? cards : []).forEach(function(card) {
    if (card && card.uid) map[card.uid] = card;
  });
  return map;
}

function toBackupCardMarkdown(card) {
  card = card || {};
  var tags = Array.isArray(card.tags) ? card.tags : [];
  var lines = [
    '---',
    'uid: ' + JSON.stringify(card.uid || ''),
    'sid: ' + JSON.stringify(card.sid || ''),
    'status: ' + JSON.stringify(card.status || ''),
    'tags: ' + JSON.stringify(tags),
    'createdAt: ' + JSON.stringify(card.createdAt || ''),
    'updatedAt: ' + JSON.stringify(card.updatedAt || ''),
    'parentUid: ' + JSON.stringify(card.parentUid || ''),
    '---',
    '',
    card.text || ''
  ];
  if (card.comment) {
    lines.push('', '## Kommentar', '', card.comment);
  }
  return lines.join('\n');
}

function toBackupCompositionMarkdown(comp, cardByUid) {
  comp = comp || {};
  cardByUid = cardByUid || {};
  var cardUids = Array.isArray(comp.cardUids) ? comp.cardUids : [];
  var lines = [
    '---',
    'uid: ' + JSON.stringify(comp.uid || ''),
    'title: ' + JSON.stringify(comp.title || ''),
    'createdAt: ' + JSON.stringify(comp.createdAt || ''),
    'updatedAt: ' + JSON.stringify(comp.updatedAt || ''),
    'cardUids: ' + JSON.stringify(cardUids),
    '---',
    ''
  ];
  cardUids.forEach(function(cardUid) {
    var card = cardByUid[cardUid];
    if (card) lines.push(card.text || '');
  });
  return lines.join('\n\n');
}

function buildBackupManifest(exportedIso, snapshot) {
  snapshot = snapshot || {};
  var cards = Array.isArray(snapshot.cards) ? snapshot.cards : [];
  var pairRelations = Array.isArray(snapshot.pairRelations) ? snapshot.pairRelations : [];
  var compositions = Array.isArray(snapshot.compositions) ? snapshot.compositions : [];
  var deletedIds = snapshot.deletedIds || {};
  return {
    app: 'rilke',
    backupVersion: '1',
    exported: exportedIso,
    counts: {
      cards: cards.length,
      activeCards: cards.filter(function(card) { return card && card.status !== 'archived'; }).length,
      archivedCards: cards.filter(function(card) { return card && card.status === 'archived'; }).length,
      pairRelations: pairRelations.length,
      compositions: compositions.length,
      deletedIds: Object.keys(deletedIds).length
    }
  };
}

function buildBackupReadme(manifest, recoveryManifest) {
  var lines = [
    '# Rilke ZIP-Backup',
    '',
    'Dies ist ein vollständiges Rilke ZIP-Backup.',
    '',
    'Es enthält technischen State als JSON und einzelne Karten als Markdown-Zettel.',
    'Es enthält keinen Importmechanismus.',
    'Gespeicherte App-Zugangsdaten aus Einstellungen/localStorage werden nicht exportiert.',
    'Kartentexte, Kommentare und Kompositionen werden als Inhalt vollständig exportiert; dort eingetragene Geheimnisse würden daher ebenfalls im Backup stehen.',
    'Recovery ist aktuell manuell/technisch möglich über die JSON-Dateien.',
    'Archivierte Karten sind absichtlich enthalten, weil Recovery vollständig sein muss.',
    '',
    'Exportiert: ' + manifest.exported,
    'Backup-Version: ' + manifest.backupVersion
  ];
  if (recoveryManifest && recoveryManifest.conflictCount > 0) {
    lines.push('', '## Legacy-/IndexedDB-Konflikt', '', 'Dieses Backup wurde während eines Legacy-/IndexedDB-Konflikts erzeugt. `state/S.json` enthält den aktuell angezeigten IndexedDB-basierten Stand. Zusätzliche abweichende Legacy-Snapshots liegen unter `recovery/legacy-conflicts/`. Die Dateien wurden nicht automatisch zusammengeführt. Prüfe beide Seiten vor einer manuellen Wiederherstellung.');
  }
  return lines.join('\n');
}

function recommendRecoveryZipBeforeRisk(reason) {
  var label = String(reason || 'riskante Operation').trim() || 'riskante Operation';
  var message = 'Empfehlung: Recovery-ZIP erstellen vor: ' + label;
  console.info(message);
  if (typeof toast === 'function') toast(message);
}

function exportZipBackup() {
  var exportedIso = now();
  var snapshot = buildBackupSnapshot();
  var manifest = buildBackupManifest(exportedIso, snapshot);
  var cardByUid = buildCardByUid(snapshot.cards);
  var config = snapshot.config || {};

  ensureJsZipLoaded().then(function(JSZipLib) {
    var zip = new JSZipLib();
    var usedCardNames = {};
    var usedCompNames = {};
    var recoveryManifest = null;
    if (_legacyConflictSnapshots.length > 0) {
      recoveryManifest = {
        schemaVersion: 'rilke-legacy-conflict-recovery-v1',
        activeStatePath: 'state/S.json',
        conflictCount: _legacyConflictSnapshots.length,
        conflicts: []
      };
      _legacyConflictSnapshots.forEach(function(entry, index) {
        var conflictSnapshot = buildBackupSnapshotFromState(entry.state);
        var path = 'recovery/legacy-conflicts/legacy-' + String(index + 1).padStart(2, '0') + '-S.json';
        recoveryManifest.conflicts.push({
          path: path,
          source: entry.source,
          capturedAt: entry.capturedAt,
          legacyTimestamp: entry.legacyTimestamp,
          fingerprint: entry.fingerprint
        });
        zip.file(path, JSON.stringify(conflictSnapshot, null, 2));
      });
      zip.file('recovery/legacy-conflicts/manifest.json', JSON.stringify(recoveryManifest, null, 2));
    }

    zip.file('manifest.json', JSON.stringify(manifest, null, 2));
    zip.file('README_BACKUP.md', buildBackupReadme(manifest, recoveryManifest));
    zip.file('state/S.json', JSON.stringify(snapshot, null, 2));
    zip.file('state/cards.json', JSON.stringify(snapshot.cards, null, 2));
    zip.file('state/pairRelations.json', JSON.stringify(snapshot.pairRelations, null, 2));
    zip.file('state/compositions.json', JSON.stringify(snapshot.compositions, null, 2));
    zip.file('state/deletedIds.json', JSON.stringify(snapshot.deletedIds, null, 2));
    zip.file('state/config.json', JSON.stringify(config, null, 2));
    zip.file('relations/pairRelations.json', JSON.stringify(snapshot.pairRelations, null, 2));

    (snapshot.cards || []).forEach(function(card, index) {
      var base = safeBackupFilename(card && card.sid ? card.sid : (card && card.uid ? card.uid : 'card_' + (index + 1)), 'card_' + (index + 1));
      var filename = base + '.md';
      var counter = 2;
      while (usedCardNames[filename]) {
        filename = base + '_' + counter + '.md';
        counter++;
      }
      usedCardNames[filename] = true;
      zip.file('markdown/cards/' + filename, toBackupCardMarkdown(card));
    });

    (snapshot.compositions || []).forEach(function(comp, index) {
      var base = safeBackupFilename(comp && comp.title ? comp.title : (comp && comp.uid ? comp.uid : 'composition_' + (index + 1)), 'composition_' + (index + 1));
      var filename = base + '.md';
      var counter = 2;
      while (usedCompNames[filename]) {
        filename = base + '_' + counter + '.md';
        counter++;
      }
      usedCompNames[filename] = true;
      zip.file('markdown/compositions/' + filename, toBackupCompositionMarkdown(comp, cardByUid));
    });

    return zip.generateAsync({ type: 'blob' });
  }).then(function(blob) {
    downloadBlob('rilke-backup-' + todayFilenamePart() + '.zip', blob);
    toast('ZIP-Backup exportiert');
  }).catch(function(err) {
    console.warn('[ZIP Backup] Export fehlgeschlagen:', err);
    toast(_legacyConflictSnapshots.length > 0 ? 'Recovery-ZIP konnte nicht vollständig erzeugt werden' : 'ZIP-Backup fehlgeschlagen');
  });
}

function openEditCompModal(compUid) {
  var comp = findComp(compUid); if (!comp) return;
  openModal('<h3>Komposition bearbeiten</h3><div class="field"><label>Titel</label><input id="m-title" value="'+esc(comp.title)+'"></div><div class="modal-actions"><button class="btn" onclick="closeModal()">Abbrechen</button><button class="btn btn-accent" onclick="doEditComp(\''+compUid+'\')">Speichern</button></div>');
}

function doEditComp(compUid) {
  if (!ensureStateWritable()) return;
  var comp = findComp(compUid); if (!comp) return;
  comp.title = $('m-title').value.trim() || comp.title; comp.updatedAt = now();
  saveDebounced(); closeModal(); renderComposition(); toast('Komposition gespeichert');
}

function confirmDeleteComp(compUid) {
  var comp = findComp(compUid); if (!comp) return;
  openModal('<h3>Komposition l\u00f6schen?</h3><p style="margin-bottom:12px">\u201e'+esc(comp.title)+'\u201c wird unwiderruflich gel\u00f6scht. Karten bleiben erhalten.</p><div class="modal-actions"><button class="btn" onclick="closeModal()">Abbrechen</button><button class="btn btn-danger" onclick="doDeleteComp(\''+compUid+'\')">L\u00f6schen</button></div>');
}

function doDeleteComp(compUid) {
  if (!ensureStateWritable()) return;
  if (!S.deletedIds || typeof S.deletedIds !== 'object' || Array.isArray(S.deletedIds)) S.deletedIds = {};
  S.deletedIds[compUid] = now();
  S.compositions = S.compositions.filter(function(c){return c.uid!==compUid});
  if (UI.selectedCompositionUid === compUid) UI.selectedCompositionUid = '';
  saveDebounced(); closeModal(); renderComposition(); toast('Komposition gel\u00f6scht');
}

/* ═══════════════════════════════════════════
   INIT
   ═══════════════════════════════════════════ */

async function init() {
  document.body.classList.add('app-loading');
  document.body.setAttribute('aria-busy', 'true');
  await load();
  switchTab('cards');
  document.body.classList.remove('app-loading');
  document.body.removeAttribute('aria-busy');
  if (_storageReadOnly) toast('Speicherproblem: ZIP-Backup empfohlen.');
}

document.addEventListener('keydown', function(e) { if (e.key === 'Escape') closeModal(); });

window.addEventListener('storage', function(event) {
  if (event.key !== LKEY || !event.newValue) return;
  if (!_persistenceReady) {
    queueStartupLegacyWrite(event.newValue);
    return;
  }
  handleRuntimeLegacyStorageValue(event.newValue);
});

init().catch(function(e) {
  handleStorageError('Rilke konnte nicht vollständig starten', e);
  try {
    drainStartupLegacyWritesToRecovery(S, { includeCurrentLegacy: true, conservative: true });
  } catch(drainError) {
    console.error('Startup-Legacy-Puffer konnte nach Startfehler nicht vollständig verarbeitet werden', drainError);
    _startupLegacyWrites = [];
  }
  _storageBackend = 'emergency';
  _storageReadOnly = true;
  _storageWriteError = true;
  _persistenceReady = true;
  document.body.classList.remove('app-loading');
  document.body.removeAttribute('aria-busy');
  switchTab('cards');
  toast('Startfehler: Speicher prüfen, ZIP-Backup empfohlen.');
});
</script>
